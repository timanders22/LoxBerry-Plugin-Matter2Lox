H_SSID = "Das 2,4-GHz-Netz. Die meisten Matter-Ger&auml;te k&ouml;nnen kein 5 GHz - h&auml;ngt bei Ihnen beides unter einem Namen, muss das Ger&auml;t beim Anlernen im 2,4-GHz-Bereich sein."
H_THREAD = "Nur f&uuml;r Thread-Ger&auml;te. Das Dataset gibt der Thread-Border-Router aus - bei Apple, Google oder einem eigenen Router. <b>Ohne Border-Router im Haus l&auml;uft kein Thread-Ger&auml;t</b>, der LoxBerry ist keiner."
