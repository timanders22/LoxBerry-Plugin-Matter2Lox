S4_IST = "Die Antwortzeile eines Stellbefehls trägt wahlweise <span class='sm-mono'>;IST=&lt;Wert&gt;</span> vor <span class='sm-mono'>MELDUNG</span> - den Zustand, den das Gerät danach meldet (etwa beim Schloss). Fehlt er, hat der Dienst keinen geliefert. <b>Schlösser:</b> <span class='sm-mono'>sperren</span> geht immer hinaus und wird nie gebremst; <span class='sm-mono'>entsperren</span> antwortet <span class='sm-mono'>UNVERAENDERT=1</span> nur, wenn derselbe Befehl in den letzten 60 s schon hinausging und das Schloss offen meldet, und HTTP 429 nur innerhalb von 10 s nach einem <span class='sm-mono'>sperren</span>. Ist die Gleichwert-Sperre eines Geräts länger als rund 2 s belegt, antwortet der Endpunkt 503 mit <span class='sm-mono'>GRUND=BESCHAEFTIGT</span>."

[MQTT]
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_SCHRITTE = "Die Themengruppe dieses Plugins lautet:"
