DIENST_ERKLAERUNG = "Der Br&uuml;ckendienst h&auml;lt die Verbindung zum Matter-Server offen und bekommt jede &Auml;nderung sofort zugestellt - es wird nicht in einem Takt abgefragt. Oberfl&auml;che und Miniserver lesen nur den Zwischenspeicher. Ein minutlicher W&auml;chter startet den Dienst neu, wenn er abst&uuml;rzt; ein von Hand angehaltener Dienst bleibt angehalten."
