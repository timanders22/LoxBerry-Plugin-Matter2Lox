GERAET_LEEREN_HILFE = "<b>Zuletzt gesehen</b> ist die Zeit der letzten Meldung, die der Matter-Server für das Gerät zugestellt hat (Wertänderung, neue Geräteangaben, Tastendruck); das Abholen des Bestands beim Verbinden zählt nicht. Ein Update des Plugins beginnt die Aufzeichnung neu. <b>Themen dieses Geräts abräumen</b> löscht die zurückbehaltenen MQTT-Themen dieses einen Geräts im Broker (<span class='sm-mono'>Präfix/geraetN/…</span> und, falls eingeschaltet, seine Themen unter <span class='sm-mono'>haus/tuer/</span>) und liest danach beim Broker nach. Andere Geräte, das Gerät selbst, die Fabric und die Adressen in Loxone bleiben unberührt. Gedacht ist der Knopf für entfernte und für abgewählte Geräte: meldet der Dienst das Gerät weiter, stehen seine Zustände spätestens nach dem nächsten Vollversand (30 Minuten) wieder im Broker. Ohne das Häkchen passiert nichts."
