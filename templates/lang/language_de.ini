CONTAINER_ERKLAERUNG = "Der Matter-Server läuft im Container, weil er drei Dinge braucht, die ein gewöhnliches Programm nicht bekommt: das Wirtsnetz für mDNS, Bluetooth über D-Bus und einen eigenen Datenordner für die Fabric. Die Aufrufzeile unten folgt wortgetreu der Anleitung des Matter-Servers - sie steht hier, damit man sie auch von Hand nachvollziehen kann."
