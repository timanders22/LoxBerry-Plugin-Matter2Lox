STEUERUNG_GESPERRT = "<b>Die Knöpfe auf dieser Seite wirken erst, wenn schreibende Befehle freigegeben sind.</b> Sie sind ab Werk gesperrt - das ist Absicht. Der Haken steht im Reiter Einstellungen unter <i>Steuerung</i>. Ohne ihn antwortet der Dienst mit „Die Steuerung ist ausgeschaltet“, und zwar auch beim Anlernen."
