[ANLERN]
CODE_ERKLAERUNG = "Der Code steht auf dem Ger&auml;t, auf einem Aufkleber oder in der Anleitung: entweder als QR-Code, dessen Text mit <span class='sm-mono'>MT:</span> beginnt, oder als elfstelliger Kopplungscode zum Abtippen. Beides geht. Das Ger&auml;t muss dabei fabrikneu oder zur&uuml;ckgesetzt sein und in Bluetooth-Reichweite des LoxBerry liegen."
DAUER_WARNUNG = "<b>Das dauert.</b> Bis zu zwei Minuten, in denen die Seite nicht antwortet: der Controller sucht das Ger&auml;t &uuml;ber Bluetooth, gibt ihm die Netzdaten, wartet auf den Netzbeitritt und liest danach alle Cluster aus. Nicht abbrechen und nicht doppelt dr&uuml;cken."
EINLEITUNG = "Anlernen heisst bei Matter: das Ger&auml;t in die Fabric dieses Controllers aufnehmen. Der Controller spricht das fabrikneue Ger&auml;t &uuml;ber Bluetooth an, gibt ihm die Netzzugangsdaten mit und tauscht Zertifikate aus. Danach l&auml;uft alles nur noch &uuml;ber das Heimnetz. <b>Ein Ger&auml;t kann in mehreren Fabrics gleichzeitig sein</b> - wer es bereits in Apple Home oder Google Home hat, l&auml;sst dort ein Kopplungsfenster &ouml;ffnen und benutzt den dabei angezeigten Code hier."
FEHLER_THREAD = "Das Thread-Dataset muss eine Hexadezimalzeichenkette sein."
HILFE_CODE = "Beispiele: <span class='sm-mono'>MT:Y.ABCDEFG123456789</span> oder <span class='sm-mono'>34970112332</span>"
H_CODE = "Gerät anlernen"
H_NETZ = "Netzzugangsdaten"
