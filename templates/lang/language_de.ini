[LOX]
EINLEITUNG = "Zwei Wege stehen zur Verf&uuml;gung &mdash; MQTT ist der Regelweg, der HTTP-Endpunkt die Alternative, wenn einzelne Werte gezielt geholt oder Befehle gesendet werden sollen."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
KEINE_GERAETE = "Es sind noch keine Ger&auml;te angelernt. Sobald das erste da ist, stehen hier seine Adressen und Befehlserkennungen."
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config:"
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eing&auml;nge selbst, und die Werte kommen in dem Augenblick, in dem sich etwas &auml;ndert - bei einem Taster oder Bewegungsmelder ist das der Unterschied zwischen brauchbar und unbrauchbar. Der HTTP-Weg fragt ab und ist damit immer einen Abfragezyklus hinterher; daf&uuml;r kann er schalten."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "In <i>System &rarr; MQTT Gateway</i> unter <i>Subscriptions</i> eintragen und speichern:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die h&auml;ufigste Fehlerursache &uuml;berhaupt."
S3_EINZELN = "<b>Der bequemere Weg:</b> Die Spalte <i>Einzelabruf</i> gibt eine Adresse, die NUR die Zahl zur&uuml;ckgibt. Ein virtueller HTTP-Eingang damit braucht &uuml;berhaupt keine Befehlserkennung. Das lohnt, wenn nur ein oder zwei Werte eines Ger&auml;ts gebraucht werden."
S3_STRICH = "<b>Ein Strich statt einer Zahl</b> bedeutet: dieses Feld gibt es bei diesem Ger&auml;t nicht. Es wird bewusst keine 0 gesendet &mdash; eine 0 w&auml;re eine stille Falschaussage. Loxone beh&auml;lt dann den zuletzt g&uuml;ltigen Wert. Genau deshalb geh&ouml;ren <span class='sm-mono'>ALTER</span>, <span class='sm-mono'>OK</span> und <span class='sm-mono'>ERREICH</span> mit ausgewertet."
S3_TEXT = "&Uuml;ber MQTT entstehen die Eing&auml;nge von selbst. F&uuml;r den HTTP-Weg stehen hier je erkanntem Ger&auml;t die Adresse und die Befehlserkennungen - keine Platzhalter, sondern das, was bei Ihnen wirklich gemeldet wird."
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_ROH = "F&uuml;r alles, was diese Liste nicht abdeckt, gibt es zwei Rohwege: <span class='sm-mono'>aktion=attribut&amp;pfad=E/C/A&amp;wert=...</span> schreibt ein beliebiges Attribut, <span class='sm-mono'>aktion=befehl&amp;cluster=N&amp;name=X&amp;nutzlast=&lt;JSON&gt;</span> setzt einen beliebigen Cluster-Befehl ab. Die Namen sind die des Matter-SDK."
S4_TEXT = "Voraussetzung: im Reiter Einstellungen sind schreibende Befehle freigegeben. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry, darunter je Befehl ein <i>Virtueller Ausgang Befehl</i>; <span class='sm-mono'>&lt;v&gt;</span> setzt Loxone durch den Zahlenwert."
S4_TITEL = "Schritt 4: Schalten (virtueller Ausgang)"
S4_WARNUNG = "<b>Die Endpunktnummer entscheidet mit.</b> Eine Lampe schaltet meist auf Endpunkt 1; eine Doppelsteckdose hat zwei Endpunkte, und ohne die richtige Nummer schaltet man die falsche Dose. Welche Endpunkte ein Ger&auml;t hat, steht im Reiter Einstellungen in der Spalte <i>Gelieferte Werte</i>."
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Deshalb ist er durch ein Token gesch&uuml;tzt; ohne passendes Token antwortet er mit HTTP 403. Ein neues Token macht alle bereits eingetragenen Adressen im Miniserver ung&uuml;ltig."
S5_TITEL = "Schritt 5: Das Token"
S6_TEXT = "F&auml;llt ein Ger&auml;t aus, behalten die virtuellen Eing&auml;nge ihren letzten Wert &mdash; in der App sieht dann alles normal aus. Deshalb gibt es zwei getrennte Melder: <span class='sm-mono'>OK</span> sagt, ob die Br&uuml;cke &uuml;berhaupt mit dem Matter-Server verbunden ist, <span class='sm-mono'>ERREICH</span> sagt es je Ger&auml;t. Ein Batteriesensor meldet sich &uuml;brigens von sich aus nur alle paar Minuten - Schwellen also grosszuegig w&auml;hlen, sonst meldet die Anlage einen Ausfall, wo nur Funkstille herrscht. Nebenbei: <span class='sm-mono'>ALTER</span> erspart jede Zeitrechnung &mdash; Loxone z&auml;hlt Sekunden seit dem 01.01.2009, ein Unix-Zeitstempel m&uuml;sste erst um 1230768000 verringert werden."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7_ERLAEUTERUNG = "<b>Zu #8 und #10:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst &uuml;ber ein ODER zusammenf&uuml;hren &mdash; sonst verschluckt eine dauerhaft aktive Quelle alle &uuml;brigen.<br><b>Zu #6:</b> Die Schwelle liegt bewusst hoch. Matter-Ger&auml;te melden sich nur bei &Auml;nderungen; ein Sensor, der zehn Minuten dieselbe Temperatur misst, ist nicht ausgefallen.<br><b>Zu #14:</b> Ohne Entprellung schickt ein Dimmer beim Ziehen des Schiebereglers Dutzende Befehle. Ein Matter-Ger&auml;t im Funknetz verarbeitet die nicht alle - und die Lampe bleibt beim vorletzten Wert stehen.<br><b>Zu #15:</b> Der Vergleicher schl&auml;gt an, wenn der zur&uuml;ckgemeldete Zustand nicht zum gesendeten passt. Das ist die ehrlichste Ausfallerkennung, die es hier gibt: sie prueft nicht, ob gesendet wurde, sondern ob es angekommen ist."
S7_TEXT = "Nachgebaut wird hier eine dimmbare Matter-Lampe, die von Loxone geschaltet und gedimmt wird und deren Ausfall gemeldet wird. Jede Zeile ist ein Baustein; Loxone Config f&uuml;hrt sie alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 10 gen&uuml;gen, wenn Loxone nur zusehen soll."
S7_TITEL = "Schritt 7: Komplette Baustein-Liste zum 1:1-Nachbauen"
S8_TEXT = "Diese drei Adressen im Browser aufrufen. Antwortet die erste mit Werten, die zweite mit 403 und die dritte mit 400, dann tr&auml;gt die Einrichtung."
S8_TITEL = "Schritt 8: Gegenprobe"
TOKEN_NEU = "Es wurde ein neues Token erzeugt. <b>Die Adressen in Loxone m&uuml;ssen angepasst werden</b> &mdash; die alten funktionieren nicht mehr."
T_ADRESSE = "Adresse"
T_BAUSTEIN = "Baustein (Typ)"
T_BEDEUTUNG = "Bedeutung"
T_BEFEHL = "Befehlserkennung"
T_EINGAENGE = "Eingänge verbinden mit"
