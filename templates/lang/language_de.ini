EINGABEN_ZURUECK = "Die Felder dieses Formulars zeigen Ihre Eingaben, nicht die gespeicherten Werte - gespeichert wurde nichts. Das beanstandete Feld ist rot umrandet. WLAN-Passwort und Thread-Dataset sind Netzzugangsdaten und werden nicht wieder eingesetzt; das Feld Thread-Dataset zeigt den gespeicherten Stand."
