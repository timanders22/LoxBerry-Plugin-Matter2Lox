[LOX]
EINLEITUNG = "Zwei Wege stehen zur Verfügung — MQTT ist der Regelweg, der HTTP-Endpunkt die Alternative, wenn einzelne Werte gezielt geholt oder Befehle gesendet werden sollen."
H_TITEL = "Einbindung in Loxone, Schritt für Schritt"
KEINE_GERAETE = "Es sind noch keine Geräte angelernt. Sobald das erste da ist, stehen hier seine Adressen und Befehlserkennungen."
K_TOKEN_NEU = "Neues Token erzeugen"
K_VORLAGE = "Vorlage für Loxone Config:"
S1_TEXT = "<b>MQTT ist der Regelweg.</b> Das Gateway erzeugt die Namen der virtuellen Eingänge selbst, und die Werte kommen in dem Augenblick, in dem sich etwas ändert - bei einem Taster oder Bewegungsmelder ist das der Unterschied zwischen brauchbar und unbrauchbar. Der HTTP-Weg fragt ab und ist damit immer einen Abfragezyklus hinterher; dafür kann er schalten."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_EINZELN = "<b>Der bequemere Weg:</b> Die Spalte <i>Einzelabruf</i> gibt eine Adresse, die NUR die Zahl zurückgibt. Ein virtueller HTTP-Eingang damit braucht überhaupt keine Befehlserkennung. Das lohnt, wenn nur ein oder zwei Werte eines Geräts gebraucht werden."
S3_NEU_EINLESEN = "<b>Nach dem Update auf 0.9.10 die Vorlage bitte neu erzeugen und einlesen.</b> Zwei Dinge haben sich geändert: das Suchmuster trägt jetzt ein führendes Semikolon (sonst konnte ein Eingang für Endpunkt 1 den Wert von Endpunkt 11 lesen), und beim Cluster ElectricalPowerMeasurement waren Spannung und Strom auf den falschen Attributnummern. Bestehende Eingänge laufen unverändert weiter - sie behalten aber den alten Fehler. Loxone Config legt beim Import neu an und überschreibt nichts: die alten Eingänge vorher löschen."
S3_STRICH = "<b>Ein Strich statt einer Zahl</b> bedeutet: dieses Feld gibt es bei diesem Gerät nicht. Es wird bewusst keine 0 gesendet — eine 0 wäre eine stille Falschaussage. Loxone behält dann den zuletzt gültigen Wert. Genau deshalb gehören <span class='sm-mono'>ALTER</span>, <span class='sm-mono'>OK</span> und <span class='sm-mono'>ERREICH</span> mit ausgewertet."
S3_TEXT = "Über MQTT entstehen die Eingänge von selbst. Für den HTTP-Weg stehen hier je erkanntem Gerät die Adresse und die Befehlserkennungen - keine Platzhalter, sondern das, was bei Ihnen wirklich gemeldet wird."
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_ROH = "Für alles, was diese Liste nicht abdeckt, gibt es zwei Rohwege: <span class='sm-mono'>aktion=attribut&amp;pfad=E/C/A&amp;wert=...</span> schreibt ein beliebiges Attribut, <span class='sm-mono'>aktion=befehl&amp;cluster=N&amp;name=X&amp;nutzlast=&lt;JSON-Objekt&gt;</span> setzt einen beliebigen Cluster-Befehl ab. Die Namen sind die des Matter-SDK. Gesperrt sind im Rohweg die Cluster 31, 48, 49, 60, 62 und 63 (Zugriffsrechte, Inbetriebnahme, Netz, Zertifikate), und Cluster 257 (Türschloss) nur mit dem Haken <i>Schlösser schalten zulassen</i>."
S4_TEXT = "Voraussetzung: im Reiter Einstellungen sind schreibende Befehle freigegeben. Ein <i>Virtueller Ausgang</i> mit der Adresse des LoxBerry, darunter je Befehl ein <i>Virtueller Ausgang Befehl</i>; <span class='sm-mono'>&lt;v&gt;</span> setzt Loxone durch den Zahlenwert."
S4_TITEL = "Schritt 4: Schalten (virtueller Ausgang)"
S4_WARNUNG = "<b>Die Endpunktnummer entscheidet mit.</b> Eine Lampe schaltet meist auf Endpunkt 1; eine Doppelsteckdose hat zwei Endpunkte, und ohne die richtige Nummer schaltet man die falsche Dose. Welche Endpunkte ein Gerät hat, steht im Reiter Einstellungen in der Spalte <i>Gelieferte Werte</i>."
S5_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht. Deshalb ist er durch ein Token geschützt; ohne passendes Token antwortet er mit HTTP 403. Ein neues Token macht alle bereits eingetragenen Adressen im Miniserver ungültig."
S5_TITEL = "Schritt 5: Das Token"
S6_TEXT = "Fällt ein Gerät aus, behalten die virtuellen Eingänge ihren letzten Wert — in der App sieht dann alles normal aus. Deshalb gibt es zwei getrennte Melder: <span class='sm-mono'>OK</span> sagt, ob die Brücke überhaupt mit dem Matter-Server verbunden ist, <span class='sm-mono'>ERREICH</span> sagt es je Gerät. Ein Batteriesensor meldet sich übrigens von sich aus nur alle paar Minuten - Schwellen also großzügig wählen, sonst meldet die Anlage einen Ausfall, wo nur Funkstille herrscht. Nebenbei: <span class='sm-mono'>ALTER</span> erspart jede Zeitrechnung — Loxone zählt Sekunden seit dem 01.01.2009, ein Unix-Zeitstempel müsste erst um 1230768000 verringert werden."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7_ERLAEUTERUNG = "<b>Zu #8 und #10:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb niemals mehrere Quellen direkt an seinen Eingang legen, sondern erst über ein ODER zusammenführen — sonst verschluckt eine dauerhaft aktive Quelle alle übrigen.<br><b>Zu #6:</b> Die Schwelle liegt bewusst hoch. Matter-Geräte melden sich nur bei Änderungen; ein Sensor, der zehn Minuten dieselbe Temperatur misst, ist nicht ausgefallen.<br><b>Zu #14:</b> Ohne Entprellung schickt ein Dimmer beim Ziehen des Schiebereglers Dutzende Befehle. Ein Matter-Gerät im Funknetz verarbeitet die nicht alle - und die Lampe bleibt beim vorletzten Wert stehen.<br><b>Zu #15:</b> Der Vergleicher schlägt an, wenn der zurückgemeldete Zustand nicht zum gesendeten passt. Das ist die ehrlichste Ausfallerkennung, die es hier gibt: sie prüft nicht, ob gesendet wurde, sondern ob es angekommen ist."
S7_TEXT = "Nachgebaut wird hier eine dimmbare Matter-Lampe, die von Loxone geschaltet und gedimmt wird und deren Ausfall gemeldet wird. Jede Zeile ist ein Baustein; Loxone Config führt sie alle in der Baustein-Suche (Taste F5). Die Zeilen 1 bis 10 genügen, wenn Loxone nur zusehen soll."
S7_TITEL = "Schritt 7: Komplette Baustein-Liste zum 1:1-Nachbauen"
S8_TEXT = "Diese drei Adressen im Browser aufrufen. Antwortet die erste mit Werten, die zweite mit 403 und die dritte mit 400, dann trägt die Einrichtung."
S8_TITEL = "Schritt 8: Gegenprobe"
