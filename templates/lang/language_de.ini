H_TUER_HAUS = "Ab Werk aus. Angehakt meldet das Plugin zusätzlich jeden Kontaktsensor unter <span class='sm-mono'>haus/tuer/&lt;Name&gt;/offen</span> (1 offen, 0 zu) und jedes Türschloss unter <span class='sm-mono'>haus/tuer/&lt;Name&gt;/verriegelt</span> (1 verriegelt, 0 nicht verriegelt), beide zurückbehalten; ohne Aussage steht <span class='sm-mono'>-</span> da. Diese Form lesen Funkwacht und Beschattungswächter. &lt;Name&gt; ist die Gerätebezeichnung, klein geschrieben, Umlaute als ae/oe/ue/ss, jedes andere Zeichen als Unterstrich (Haustür wird haustuer). Braucht <i>Werte per MQTT veröffentlichen</i>. Abhaken räumt die gemeldeten Themen im Broker ab."
DOCKER_FEHLT = "<b>Docker fehlt.</b> Den Matter-Server betreibt das Plugin als Docker-Container. Docker lässt sich mit dem LoxBerry-Plugin <b>Docker NG</b> installieren (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>; das ältere Plugin Docker geht auch); danach diese Seite neu laden. Oder einen Matter-Server auf einem anderen Rechner betreiben: den Haken „Matter-Server von diesem Plugin betreiben lassen (Docker)“ unten abnehmen und nur dessen Adresse eintragen."
DOCKER_KEIN_ZUGRIFF = "<b>Kein Zugriff auf Docker.</b> Docker ist installiert, antwortet dem Plugin aber nicht: der Benutzer <span class='sm-mono'>loxberry</span> muss in der Gruppe <span class='sm-mono'>docker</span> sein, und der Docker-Dienst muss laufen. Beides richtet das LoxBerry-Plugin <b>Docker NG</b> ein (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>); von Hand: <span class='sm-mono'>sudo usermod -aG docker loxberry</span> und neu anmelden. Danach diese Seite neu laden. Ein Matter-Server auf einem anderen Rechner geht ebenso: Haken „Matter-Server von diesem Plugin betreiben lassen (Docker)“ abnehmen und nur die Adresse eintragen."
