S4_GLEICHWERT = "<b>Derselbe Wert geht höchstens einmal je Minute hinaus.</b> Schickt ein virtueller Ausgang denselben Sollwert (Ein/Aus, Helligkeit, Farbe, Farbton, Sättigung, Farbtemperatur, Loxone-Farbe, Farbort, Rollo-Position, Lamelle, Soll-Temperaturen, Betriebsart, Lüfter) innerhalb von 60 s erneut an dasselbe Gerät, antwortet der Endpunkt <span class='sm-mono'>SET;OK=1;AKTION=…;UNVERAENDERT=1</span> und sendet nichts. Ein anderer Wert geht sofort hinaus. Umschalten, Rollo auf/zu/stopp, Identify und die Rohwege gehen immer hinaus. Gemerkt wird, was über den Endpunkt hinausging: wer in derselben Minute am Gerät, in einer App oder im Reiter Test schaltet, dessen nächster gleicher Loxone-Befehl wird trotzdem unterdrückt."
