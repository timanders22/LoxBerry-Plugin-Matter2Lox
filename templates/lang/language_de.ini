UMSTIEG_ERKLAERUNG = "<b>Beta, mit diesem Plugin ungeprüft.</b> Der python-matter-server ist archiviert; sein Nachfolger <span class='sm-mono'>matterjs-server</span> bietet laut seiner Anleitung dieselbe WebSocket-Schnittstelle und übernimmt beim ersten Start die Fabric aus demselben Datenordner (<span class='sm-mono'>chip.json</span>, <span class='sm-mono'>&lt;fabricId&gt;.json</span>); die Python-Dateien schreibt er weiter mit, ein Rückweg ist deshalb möglich. Der Knopf stellt das Abbild auf <span class='sm-mono'>ghcr.io/matter-js/matterjs-server:stable</span>, speichert und legt den Container im Hintergrund neu an - vorher wird die Fabric automatisch gesichert, und läuft der neue nicht an, kommt der alte zurück. Die Aufrufzeile passt das Plugin an: ohne <span class='sm-mono'>--paa-root-cert-dir</span> (kennt er nicht), mit <span class='sm-mono'>--fabricid 1</span> (ab Werk wählt er sie zufällig) und mit <span class='sm-mono'>--user</span> = Eigentümer des Fabric-Ordners (er läuft ohne root). Ungeprüft ist insbesondere Bluetooth ohne root. Beide Server dürfen nie gleichzeitig auf derselben Fabric laufen - der Reiter Test prüft das."
