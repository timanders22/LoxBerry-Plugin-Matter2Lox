[ANLERN]
CODE_ERKLAERUNG = "Der Code steht auf dem Gerät, auf einem Aufkleber oder in der Anleitung: entweder als QR-Code, dessen Text mit <span class='sm-mono'>MT:</span> beginnt, oder als elfstelliger Kopplungscode zum Abtippen. Beides geht. Das Gerät muss dabei fabrikneu oder zurückgesetzt sein und in Bluetooth-Reichweite des LoxBerry liegen."
DAUER_WARNUNG = "<b>Das dauert.</b> Bis zu drei Minuten, in denen die Seite nicht antwortet: der Controller sucht das Gerät über Bluetooth, gibt ihm die Netzdaten, wartet auf den Netzbeitritt und liest danach alle Cluster aus. Nicht abbrechen und nicht doppelt drücken."
EINLEITUNG = "Anlernen heißt bei Matter: das Gerät in die Fabric dieses Controllers aufnehmen. Der Controller spricht das fabrikneue Gerät über Bluetooth an, gibt ihm die Netzzugangsdaten mit und tauscht Zertifikate aus. Danach läuft alles nur noch über das Heimnetz. <b>Ein Gerät kann in mehreren Fabrics gleichzeitig sein</b> - wer es bereits in Apple Home oder Google Home hat, lässt dort ein Kopplungsfenster öffnen und benutzt den dabei angezeigten Code hier."
FEHLER_THREAD = "Das Thread-Dataset muss eine Hexadezimalzeichenkette sein."
