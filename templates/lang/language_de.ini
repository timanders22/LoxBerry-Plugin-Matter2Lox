S_SAMMEL = "Bei vielen Geräten ist das Anlegen Gerät für Gerät lästig. Diese Datei enthält <b>alle</b> erkannten Geräte in einem einzigen virtuellen HTTP-Eingang. Sie fragt den Endpunkt <span class='sm-mono'>aktion=statusalle</span> ab, und die Marken tragen die Gerätenummer bereits im Namen: <span class='sm-mono'>MATTER_3_1_TEMPERATUR</span>. <b>Achtung:</b> Loxone Config legt beim Import stets neu an und überschreibt nichts - zweimal eingelesen ergibt doppelte Bausteine."
M_VORLAGE_LEER = "Für dieses Gerät gibt es keinen einzigen schaltbaren Wert - die Vorlage wäre leer. Das Gerät meldet keinen Schalter, keine Helligkeit, keine Farbe und keinen Sollwert. Erst abrufen lassen, dann noch einmal versuchen."
