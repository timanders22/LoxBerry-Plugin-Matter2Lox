H_SSID = "Das 2,4-GHz-Netz. Die meisten Matter-Geräte können kein 5 GHz - hängt bei Ihnen beides unter einem Namen, muss das Gerät beim Anlernen im 2,4-GHz-Bereich sein."
H_THREAD = "Nur für Thread-Geräte. Das Dataset gibt der Thread-Border-Router aus - bei Apple, Google oder einem eigenen Router. <b>Ohne Border-Router im Haus läuft kein Thread-Gerät</b>, der LoxBerry ist keiner."
