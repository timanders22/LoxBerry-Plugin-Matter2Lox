FABRIC_WARNUNG = "<b>Der Datenordner wird nie mitgelöscht.</b> Darin liegen die Fabric und die Zertifikate des Controllers. <i>Container entfernen</i> löscht nur den Container; die angelernten Geräte bleiben erhalten und sind nach <i>Container anlegen</i> wieder da. Wer dagegen den Datenordner von Hand löscht, muss jedes Gerät neu anlernen - und die Geräte selbst muss man vorher zurücksetzen, weil sie sonst noch an eine Fabric gebunden sind, die es nicht mehr gibt."
FABRIC_ZURUECK = "<b>Zurückspielen</b> geht bewusst nicht über die Oberfläche: ein Endpunkt, der ein beliebiges Archiv in den Datenordner auspackt, wäre eine Hintertür, und ein Zurückspielen bei laufendem Container zerstört die Fabric. Von Hand, mit angehaltenem Container:"
