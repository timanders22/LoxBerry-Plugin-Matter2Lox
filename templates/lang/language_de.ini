SEITE1_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ den Matter-Server einrichten (Knopf „Matter-Server einrichten“) und den Dienst starten. Im Reiter „Geräte anlernen“ die Geräte aufnehmen. Ist ein Gerät schon in Alexa, Google oder Apple, dort ein Kopplungsfenster öffnen und den Code hier eintragen."
SEITE1_SCHRITT2 = "In Schritt 3 dieses Reiters je Gerät den Knopf „Vorlage für Loxone Config:“ mit dem Gerätenamen drücken. In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren, je Datei nur EINMAL (zweimal ergibt doppelte Eingänge). Im Musterprojekt heißen die Behälter „Matter 1 Leselampe“, „Matter 2 Steckdose Terrasse“ und „Matter 3 Klimasensor Bad“."
SEITE1_SCHRITT3 = "Nur für MQTT (Taster, Bewegungsmelder, Herzschlag): Im Plugin muss „Werte per MQTT veröffentlichen“ an sein (ab Werk an). Unter System → MQTT Gateway muss der Autostart an sein. Den Virtuellen Eingang „matter_ts“ von Hand anlegen, Titel genau so."
SEITE1_SCHRITT4 = "Seite „Matter2Lox“ anlegen, die Befehle der Liste aus den Behältern ziehen (Nr. 1, 2, 12, 13, 14), dazu die Konstante „Konstante 1“ (Nr. 4; im Musterprojekt schon vorhanden). Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen): „Meldung Plugin gestört (Matter)“ und „Meldung Gerät antwortet nicht (Matter)“, Text wie in der Tabelle."
SEITE1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. An beiden Analogwertvalidierungen (Nr. 5 und 6) den Haken bei ‚En‘ im Eigenschaftsfenster entfernen – Config legt En negiert an, sonst kommt die Konstante 1 als 0 an. Am UND Nr. 18 den Eingang I2 negieren: auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Am Status „Zustand (Matter)“ vorher dreimal auf „+“ klicken (V5 bis V7); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
SEITE1_SCHRITT6 = "Speichern und übertragen. Probe: „Zustand (Matter)“ zeigt „läuft – Werte … s alt“; MATTER_1_ALTER ändert sich jede Minute; matter_ts läuft weiter."
SEITE1_H1 = "Die Meldung kommt erst nach 10 Minuten Störung; steht der LoxBerry ganz, nach etwa 15 Minuten (5 Minuten bis zum fehlenden Lebenszeichen und 10 Minuten)."
SEITE1_H2 = "<b>Zu Nr. 2 und 5:</b> Das Alter wächst in einem ruhigen Haus bis 30 Minuten, weil das Plugin nur bei Änderungen schreibt. Es ist ein Lebenszeichen (es ändert sich bei jeder Abfrage), keine Altersgrenze – deshalb die Analogwertvalidierung und nie ein Schwellwert am Alter."
SEITE1_H3 = "<b>Zu Nr. 3, 6 und 8:</b> Taster und Bewegungsmelder kommen über MQTT; schweigt das Gateway, merkt man es nur am Herzschlag. Wer MQTT nicht nutzt: Nr. 3, 6 und 8 weglassen, Nr. 7 direkt an I1 von Nr. 9."
SEITE1_H4 = "<b>Zu Nr. 18:</b> Bei gestörtem Plugin melden alle Geräte „antwortet nicht“; das UND mit dem negierten Eingang lässt dann nur die Meldung Nr. 11 durch."
SEITE1_H5 = "Weitere Geräte: je Gerät die eigene Vorlage importieren. Ein Gerät am Netz bekommt ein NICHT an seinem ERREICH und ein weiteres ODER vor Nr. 18 – nie mehrere Quellen direkt an die Benachrichtigung. Batteriegeräte nur im Status zeigen."
SEITE1_H6 = "Ein neues Token im Plugin („Neues Token erzeugen“) macht alle Adressen ungültig: danach die Vorlagen neu holen oder die Adressen am Behälter erneuern. Ist ein Lesetoken eingerichtet, tragen die Eingangsvorlagen es; die Ausgänge brauchen weiter das Aktionstoken."
SEITE2_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ den Haken „Schreibende Befehle zulassen“ setzen und speichern. Ohne ihn schaltet Loxone nichts (Antwort 403)."
SEITE2_SCHRITT2 = "In Schritt 3 dieses Reiters je schaltbarem Gerät den Knopf „Ausgänge:“ mit dem Gerätenamen drücken. In Config: Peripherie → Virtuelle Ausgänge → Vorlage importieren. Die Eingangsbehälter von Seite „Matter2Lox“ nicht erneut importieren."
SEITE2_SCHRITT3 = "Für Taster und Bewegungsmelder die Virtuellen Eingänge von Hand anlegen, Titel genau wie in der Tabelle (z. B. matter_geraet4_1_taste_kurz). Die Nummer nach „geraet“ ist die Gerätenummer aus dem Reiter Einstellungen, die Zahl danach der Endpunkt. Wer unsicher ist, sieht im MQTT Finder des LoxBerry nach (System → MQTT Gateway)."
SEITE2_SCHRITT4 = "Seite „Matter2Lox Geräte“ anlegen, die Befehle ziehen, die übrigen Bausteine über F5 setzen. Am Dimmer (Nr. 5) Sts 5 und Str 0,5 einstellen. Die Leitungen in die Eingänge Tg von Dimmer (Nr. 5) und Schalter (Nr. 17) von Hand ziehen. Die Benachrichtigung „Meldung Bewegung bei Abwesenheit (Matter)“ anlegen (Peripherie → Mitteilungen)."
SEITE2_SCHRITT5 = "Speichern und übertragen. Probe: die Leselampe in der App dimmen. Spätestens nach einer Minute zeigt „Leselampe Rückmeldung (Matter)“ „an – …“. Kurz auf den Taster drücken, die Lampe schaltet um."
SEITE2_H1 = "Die Rückmeldungen kommen über HTTP, also bis zu einer Minute später. Taster und Bewegungsmelder kommen über MQTT sofort."
SEITE2_H2 = "<b>Zu Nr. 5 und 6:</b> Nur die Helligkeit geht hinaus (0 schaltet aus, 1 bis 100 schaltet ein) – ein Befehl je Änderung. Sts und Str begrenzen die Befehle beim Dimmen."
SEITE2_H3 = "<b>Zu Nr. 10 bis 12:</b> „Folgt nicht“ ist ein Hinweis, keine Meldung: die Lampe darf auch aus Alexa, Google, Apple oder am Gerät geschaltet werden. Der Status zeigt dann den echten Zustand; der Dimmer in Loxone bleibt, wo er war."
SEITE2_H4 = "Die Endpunktnummern (MATTER_3_2_FEUCHTE …) sind Beispiele. Die eigene Vorlage bringt die richtigen; eine Doppelsteckdose hat zwei Endpunkte."
SEITE2_H5 = "Für Farblampen gibt es MATTER_1_LOXFARBE (RGB oder Lumitech vom Ausgang einer Lichtsteuerung). Eine Lichtsteuerung steht im Musterprojekt nicht; wer eine hat, legt ihren Kreis-Ausgang an diesen Befehl statt des Dimmers an Nr. 6."
SEITE2_H6 = "Schlösser schaltet das Plugin nur mit dem eigenen Haken „Schlösser schalten zulassen“; im Muster gibt es bewusst keines. Ebenso bewusst nicht im Muster: Rohwege, Behang, Thermostat, Lüfter, Wallbox und Rauchmelder (je eigenes Gerät, gleiche Form wie die Lampe), die Sammelvorlage und der Onlinestatus des Behälters (die Analogwertvalidierung auf Seite „Matter2Lox“ erkennt „LoxBerry aus“)."
SEITE3_SCHRITT1 = "In Loxone Config einen eigenen Benutzer „matterbridge“ in einer eigenen Gruppe anlegen, nicht den Admin. Die Gruppe braucht das Recht „Webseite/Apps“. Rechte nur auf die Räume oder Bausteine geben, die in Alexa erscheinen sollen. An jedem dieser Bausteine „In Visualisierung verwenden“ setzen, dann in den Miniserver speichern."
SEITE3_SCHRITT2 = "Im Plugin Reiter „Bridge“ den Haken „Bridge betreiben (Beta, ab Werk aus)“ setzen. In Schritt 2 dort Benutzer und Kennwort eintragen, „Speichern und Anmeldung prüfen“ drücken, danach „Bridge einrichten“. Ein falsches Kennwort sperrt den Benutzer nach einigen Versuchen; das Plugin prüft deshalb nur einmal."
SEITE3_SCHRITT3 = "Im Reiter Bridge Schritt 3 die Bausteine anhaken („Gartenlicht (Matter-Bridge)“ als „light“, „Raumtemperatur Wohnzimmer (eigene Quelle)“ als Temperatur) und „Auswahl übernehmen“ drücken."
SEITE3_SCHRITT4 = "In der Alexa-App: Gerät hinzufügen → Matter, den QR-Code aus Schritt 4 des Reiters Bridge scannen. Google braucht einmalig ein Entwicklerprojekt (Anleitung im Reiter Bridge)."
SEITE3_SCHRITT5 = "Seite „Matter2Lox Bridge“ wie in der Tabelle anlegen. Probe: „Alexa, schalte Gartenlicht ein“ – der Status zeigt „Gartenlicht an“."
SEITE3_H1 = "Die Bridge ist Beta und am echten Gerät noch nicht über das Plugin gemessen."
SEITE3_H2 = "Sie meldet nichts an Loxone zurück; ihren Zustand zeigt nur der Reiter Bridge. Ein Anmeldefehler kommt als LoxBerry-Meldung."
SEITE3_H3 = "Angeboten werden Schalter, Taster, Jalousien, Fühler (Temperatur, Feuchte, Luftdruck) und die Kreise einer Lichtsteuerung. Tore, Türen, Alarm, Raumregler und Radiotasten bietet die Bridge bewusst nicht an. Alexa zeigt höchstens 50 Geräte."
SEITE3_H4 = "Ein Matter-Gerät, das schon direkt in Alexa ist (z. B. die Leselampe), nicht zusätzlich über einen Loxone-Baustein freigeben – sonst steht es zweimal in Alexa."

[EINST]
CONTAINER_ERKLAERUNG = "Der Matter-Server läuft im Container, weil er drei Dinge braucht, die ein gewöhnliches Programm nicht bekommt: das Wirtsnetz für mDNS, Bluetooth über D-Bus und einen eigenen Datenordner für die Fabric. Die Aufrufzeile unter „Für Fortgeschrittene“ folgt wortgetreu der Anleitung des Matter-Servers - sie steht dort, damit man sie auch von Hand nachvollziehen kann. Docker bringt das LoxBerry-Plugin <b>Docker NG</b> mit (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>)."
CONTAINER_FEHL = "Container: %s fehlgeschlagen."
CONTAINER_OK = "Container: %s erledigt."
DIENST_ERKLAERUNG = "Der Brückendienst hält die Verbindung zum Matter-Server offen und bekommt jede Änderung sofort zugestellt - es wird nicht in einem Takt abgefragt. Oberfläche und Miniserver lesen nur den Zwischenspeicher. Ein minutlicher Wächter startet den Dienst neu, wenn er abstürzt; ein von Hand angehaltener Dienst bleibt angehalten."
DIENST_RESTART = "Dienst neu gestartet."
DIENST_START = "Dienst gestartet."
DIENST_STOP = "Dienst angehalten."
ARCHIV_VERWEIGERT = "Diese Oberfläche läuft aus einem ausgepackten Archiv, nicht aus der Installation. Dienst und Container werden von hier aus nicht angefasst."
FRIST_ABGELAUFEN = "Nach %d Sekunden ohne Antwort abgebrochen."
FABRIC_SICHERN_ERKLAERUNG = "Im Datenordner liegen die <b>Fabric und die Zertifikate</b> dieses Controllers. Kein Archiv liefert sie mit, und wer sie verliert, muss jedes Gerät zurücksetzen und neu anlernen. <b>Vor dem Sichern den Container anhalten</b>, sonst wird mitten in eine offene Datei hinein gepackt."
FABRIC_WARNUNG = "<b>Fabric und Zertifikate liegen seit 0.9.17 NEBEN dem Datenordner</b> und überstehen damit jedes Plugin-Update. Bis 0.9.16 lagen sie darin - und der LoxBerry-Installer räumt den Datenordner bei jedem Update ab, sodass jedes Gerät neu anzulernen war. <i>Container entfernen</i> löscht nur den Container; die angelernten Geräte bleiben erhalten und sind nach <i>Matter-Server einrichten</i> wieder da. Wer dagegen den Datenordner von Hand löscht, muss jedes Gerät neu anlernen - und die Geräte selbst muss man vorher zurücksetzen, weil sie sonst noch an eine Fabric gebunden sind, die es nicht mehr gibt."
