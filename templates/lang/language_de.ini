GESPEICHERT = "Die Einstellungen wurden gespeichert, samt Sicherungskopie für Updates."
H_AKTUALISIEREN = "<b>Abbild neu holen allein wirkt nicht.</b> Der laufende Container hängt an der Kennung, mit der er angelegt wurde; erst das Neuanlegen bringt den neuen Stand. Dieser Knopf holt das Abbild und legt den Container neu an, wenn es neuer ist - mit Rückweg (der alte wird erst entfernt, wenn der neue läuft) und vorher automatisch gesicherter Fabric. Er nennt die Kennung vorher und nachher. Die Fabric selbst bleibt unberührt. Der Matter-Server ist dabei kurz nicht erreichbar. Das läuft im Hintergrund; die Seite zeigt den Stand."
H_BLUETOOTH_ADAPTER = "0 ist der eingebaute Adapter eines Raspberry Pi. Ohne Bluetooth lassen sich nur Geräte anlernen, die schon im Netz sind."
H_CONTAINER = "Der Matter-Server"
H_DIENST = "Brückendienst"
H_EIGENER_CONTAINER = "Angehakt: das Plugin betreibt den Matter-Server als Docker-Container (oben). Nicht angehakt: Sie betreiben den Matter-Server anderswo, dann zählen nur Adresse und Port, und Docker wird nicht gebraucht."
H_ERKANNT = "Erkannte Geräte"
H_FABRIC = "Fabric sichern"
H_HERZSCHLAG = "Der Dienst meldet sich in diesem Abstand unter <span class='sm-mono'>online</span> und <span class='sm-mono'>ts</span>, auch wenn sich kein Wert geändert hat. Ohne dieses Lebenszeichen sieht ein toter Dienst in Loxone genauso aus wie ein ruhiges Haus: die zuletzt gesendeten Werte bleiben einfach stehen. 0 schaltet den Herzschlag ab."
H_MQTT_NUR = "Leer heißt: alle. Bei einer Bridge mit fünfzig Endpunkten ist das der Unterschied zwischen benutzbar und unbenutzbar. Mehrere Nummern durch Komma trennen. Wirkt nur auf MQTT - Oberfläche und Loxone-Endpunkt sehen weiterhin alles."
H_ROH_EIN = "Was das Plugin nicht kennt, geht sonst verloren. Angehakt landet jedes unbekannte Attribut zusätzlich unter <span class='sm-mono'>geraetN/roh/Endpunkt/Cluster/Attribut</span> - unumgerechnet. Nur der Cluster 29 bleibt außen vor: er beschreibt den Aufbau des Geräts und wäre auf dem Broker nur Rauschen."
H_SCHLOSS_EIN = "Bewusst ein <b>eigener</b> Haken. Wer Lampen aus Loxone schalten lässt, will damit nicht zwangsläufig die Haustür aufsperren lassen. Gilt für die Aktionen <span class='sm-mono'>sperren</span> und <span class='sm-mono'>entsperren</span>; die allgemeine Freigabe muss zusätzlich gesetzt sein."
H_SENDETAKT = "Kürzester Abstand zwischen zwei Veröffentlichungen. Matter meldet jede Änderung einzeln; ein bewegter Dimmer erzeugt damit hunderte Meldungen je Sekunde. Innerhalb des Takts werden Änderungen gesammelt und danach in einem Zug gesendet - und zwar nur die, die sich wirklich geändert haben. 0 sendet sofort und vollständig, wie bis 0.9.9."
H_SERVER_PORT = "Vorgabe 5580. Der Dienst verbindet sich auf <span class='sm-mono'>ws://Adresse:Port/ws</span>."
