[EINST]
CONTAINER_ERKLAERUNG = "Der Matter-Server läuft im Container, weil er drei Dinge braucht, die ein gewöhnliches Programm nicht bekommt: das Wirtsnetz für mDNS, Bluetooth über D-Bus und einen eigenen Datenordner für die Fabric. Die Aufrufzeile unter „Für Fortgeschrittene“ folgt wortgetreu der Anleitung des Matter-Servers - sie steht dort, damit man sie auch von Hand nachvollziehen kann. Docker bringt das LoxBerry-Plugin <b>Docker NG</b> mit (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>)."
CONTAINER_FEHL = "Container: %s fehlgeschlagen."
CONTAINER_OK = "Container: %s erledigt."
DIENST_ERKLAERUNG = "Der Brückendienst hält die Verbindung zum Matter-Server offen und bekommt jede Änderung sofort zugestellt - es wird nicht in einem Takt abgefragt. Oberfläche und Miniserver lesen nur den Zwischenspeicher. Ein minutlicher Wächter startet den Dienst neu, wenn er abstürzt; ein von Hand angehaltener Dienst bleibt angehalten."
DIENST_RESTART = "Dienst neu gestartet."
DIENST_START = "Dienst gestartet."
DIENST_STOP = "Dienst angehalten."
ARCHIV_VERWEIGERT = "Diese Oberfläche läuft aus einem ausgepackten Archiv, nicht aus der Installation. Dienst und Container werden von hier aus nicht angefasst."
FRIST_ABGELAUFEN = "Nach %d Sekunden ohne Antwort abgebrochen."
FABRIC_SICHERN_ERKLAERUNG = "Im Datenordner liegen die <b>Fabric und die Zertifikate</b> dieses Controllers. Kein Archiv liefert sie mit, und wer sie verliert, muss jedes Gerät zurücksetzen und neu anlernen. <b>Vor dem Sichern den Container anhalten</b>, sonst wird mitten in eine offene Datei hinein gepackt."
FABRIC_WARNUNG = "<b>Fabric und Zertifikate liegen seit 0.9.17 NEBEN dem Datenordner</b> und überstehen damit jedes Plugin-Update. Bis 0.9.16 lagen sie darin - und der LoxBerry-Installer räumt den Datenordner bei jedem Update ab, sodass jedes Gerät neu anzulernen war. <i>Container entfernen</i> löscht nur den Container; die angelernten Geräte bleiben erhalten und sind nach <i>Matter-Server einrichten</i> wieder da. Wer dagegen den Datenordner von Hand löscht, muss jedes Gerät neu anlernen - und die Geräte selbst muss man vorher zurücksetzen, weil sie sonst noch an eine Fabric gebunden sind, die es nicht mehr gibt."
FABRIC_ZURUECK = "Von Hand geht es so, mit angehaltenem Container:"
FEHLER_ABBILD = "Das Abbild sieht nicht wie ein Docker-Abbildname aus."
FEHLER_BEREICH = "%s: der Wert muss zwischen %d und %d liegen."
FEHLER_CONTAINERBEFEHL = "Unbekannter Containerbefehl."
FEHLER_CONTAINERNAME = "Der Containername darf nur Buchstaben, Ziffern, Punkt, Bindestrich und Unterstrich enthalten."
FEHLER_HOST = "Die Adresse des Matter-Servers ist kein gültiger Name und keine gültige Adresse."
FEHLER_MQTT_NUR = "Die Geräteauswahl muss aus Zahlen bestehen, durch Komma getrennt - zum Beispiel <span class='sm-mono'>1,3,7</span>."
FEHLER_SPEICHERN = "Die Konfiguration ließ sich nicht schreiben: %s"
FEHLER_TOPIC = "Das Themen-Präfix darf nur Buchstaben, Ziffern, Bindestrich, Unterstrich und Schrägstrich enthalten und nicht leer sein."
FEHLER_ZAHL = "%s: bitte eine ganze Zahl eintragen."
GESPEICHERT = "Die Einstellungen wurden gespeichert, samt Sicherungskopie für Updates."
H_AKTUALISIEREN = "<b>Abbild neu holen allein wirkt nicht.</b> Der laufende Container hängt an der Kennung, mit der er angelegt wurde; erst das Neuanlegen bringt den neuen Stand. Dieser Knopf holt das Abbild und legt den Container neu an, wenn es neuer ist - mit Rückweg (der alte wird erst entfernt, wenn der neue läuft) und vorher automatisch gesicherter Fabric. Er nennt die Kennung vorher und nachher. Die Fabric selbst bleibt unberührt. Der Matter-Server ist dabei kurz nicht erreichbar. Das läuft im Hintergrund; die Seite zeigt den Stand."
H_BLUETOOTH_ADAPTER = "0 ist der eingebaute Adapter eines Raspberry Pi. Ohne Bluetooth lassen sich nur Geräte anlernen, die schon im Netz sind."
H_CONTAINER = "Der Matter-Server"
H_DIENST = "Brückendienst"
H_EIGENER_CONTAINER = "Angehakt: das Plugin betreibt den Matter-Server als Docker-Container (oben). Nicht angehakt: Sie betreiben den Matter-Server anderswo, dann zählen nur Adresse und Port, und Docker wird nicht gebraucht."
H_ERKANNT = "Erkannte Geräte"
H_FABRIC = "Fabric sichern"
H_HERZSCHLAG = "Der Dienst meldet sich in diesem Abstand unter <span class='sm-mono'>online</span> und <span class='sm-mono'>ts</span>, auch wenn sich kein Wert geändert hat. Ohne dieses Lebenszeichen sieht ein toter Dienst in Loxone genauso aus wie ein ruhiges Haus: die zuletzt gesendeten Werte bleiben einfach stehen. 0 schaltet den Herzschlag ab."
H_MQTT_NUR = "Leer heißt: alle. Bei einer Bridge mit fünfzig Endpunkten ist das der Unterschied zwischen benutzbar und unbenutzbar. Mehrere Nummern durch Komma trennen. Wirkt nur auf MQTT - Oberfläche und Loxone-Endpunkt sehen weiterhin alles."
H_ROH_EIN = "Was das Plugin nicht kennt, geht sonst verloren. Angehakt landet jedes unbekannte Attribut zusätzlich unter <span class='sm-mono'>geraetN/roh/Endpunkt/Cluster/Attribut</span> - unumgerechnet. Nur der Cluster 29 bleibt außen vor: er beschreibt den Aufbau des Geräts und wäre auf dem Broker nur Rauschen."
H_SCHLOSS_EIN = "Bewusst ein <b>eigener</b> Haken. Wer Lampen aus Loxone schalten lässt, will damit nicht zwangsläufig die Haustür aufsperren lassen. Gilt für die Aktionen <span class='sm-mono'>sperren</span> und <span class='sm-mono'>entsperren</span>; die allgemeine Freigabe muss zusätzlich gesetzt sein."
H_SENDETAKT = "Kürzester Abstand zwischen zwei Veröffentlichungen. Matter meldet jede Änderung einzeln; ein bewegter Dimmer erzeugt damit hunderte Meldungen je Sekunde. Innerhalb des Takts werden Änderungen gesammelt und danach in einem Zug gesendet - und zwar nur die, die sich wirklich geändert haben. 0 sendet sofort und vollständig, wie bis 0.9.9."
H_SERVER_PORT = "Vorgabe 5580. Der Dienst verbindet sich auf <span class='sm-mono'>ws://Adresse:Port/ws</span>."
