; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Matter to Loxone"
K02 = "<b>This plugin is the bridge, not the Matter controller.</b> Matter requires a certified controller with its own fabric, certificates, commissioning over Bluetooth and IPv6 multicast. One already exists: the <i>Matter server</i> of the Open Home Foundation, the very same piece Home Assistant uses. It runs in a container; the plugin talks to its interface, translates the values and passes them on to Loxone."
K03 = "Three prerequisites the plugin cannot create"
K04 = "<b>IPv6.</b> Matter relies on IPv6 link-local multicast. Without IPv6 nothing works at all."
K05 = "<b>A flat network.</b> Multicast filters, mDNS relays and VLANs between the device, the border router and the LoxBerry break Matter — and they break it in a way that makes everything look correctly set up."
K06 = "<b>64 bit.</b> The Matter server explicitly runs on 64-bit systems only."
K07 = "Thread devices additionally need a Thread border router in the house. The LoxBerry is not one."
K08 = "How to proceed"
K09 = "<b>Settings:</b> press <i>Set up Matter server</i> - it pulls the image, creates the container and starts it, in the background; the traffic light below shows the state. Docker for that comes with the LoxBerry plugin <b>Docker NG</b> (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>; the older plugin Docker works as well). If you already have a Matter server on another machine, untick „Run the Matter server myself“ and just enter its address. Then start the bridge service."
K10 = "<b>Test:</b> the self-check works through the prerequisites in order. Every failed line names the remedy."
K11 = "<b>Commissioning devices:</b> store the Wi-Fi credentials and hand them over, then type in the code from the device."
K12 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver. <b>This applies to MQTT&#8209;gateway&nbsp;V1.</b> From version&nbsp;2 on the topic group appears by itself under Subscriptions and nothing needs to be entered."
K13 = "<b>Loxone integration:</b> step by step, with a list of blocks."
K14 = "How the translation works"
K15 = "Matter delivers numbers without units: a temperature arrives as 2347, a brightness as 178 out of 254, a power reading in milliwatts. The mapping including the conversion lives in a single file (<span class='sm-mono'>matter_cluster.json</span>) that the service and the interface read together. The MQTT tab displays it in full. Anything the plugin does not know can optionally be published raw as well — nothing is lost."
K16 = "What has not been tested"
K17 = "This plugin was built without a Matter device and without a running Matter server. It was tested against a stub that reproduces the documented protocol. Whether the login, the commissioning and the cluster commands hold up against a real device remains to be seen."
K18 = "Basis"
K19 = "All protocol details come from the interface description and the source of the Open Home Foundation Matter server (matter-js/python-matter-server, Apache&nbsp;2.0)."
K20 = "The Matter server is archived"
K21 = "Checked on 06.08.2026: the project moved from <i>home-assistant-libs</i> to the organisation <i>matter-js</i> and was <b>archived there on 23.06.2026</b> — it is read-only. The container image <span class='sm-mono'>ghcr.io/matter-js/python-matter-server:stable</span> <b>is still available</b> (version 8.1.2, published about eight months ago, more than 1.1&nbsp;million pulls). So this plugin does run."
K22 = "In practice this means: new device types and bug fixes no longer appear here but in the successor <i>matterjs-server</i> of the same organisation. Existing installations keep running as long as the image stays available."
K23 = "Checked on 17 August 2026: the successor describes itself as a <i>drop-in replacement</i> with a WebSocket interface compatible with the Python Matter Server, and lists five intentional deviations - none of them touches a path this plugin uses. That is not a field test, but the earlier caveat „not verified“ was one that could have been looked up."
K24 = "<b>OK in the endpoint:</b> 1 means the bridge service is connected to the Matter server AND its heartbeat is at most three intervals old (setting heartbeat, default 60 s, i.e. 180 s). If the service dies or hangs, OK drops to 0 at the latest after that. ALTER next to it is the age of the values and grows in a quiet house even with a healthy service. With heartbeat 0 there is no age limit."
K25 = "<b>Doors and locks under the house topic</b> (MQTT tab, off by default): every contact sensor is additionally published as <span class='sm-mono'>haus/tuer/&lt;name&gt;/offen</span> (1 open, 0 closed), every door lock as <span class='sm-mono'>haus/tuer/&lt;name&gt;/verriegelt</span> (1 locked, 0 not), both retained, <span class='sm-mono'>-</span> without a statement. &lt;name&gt; is the device label in lower case, umlauts as ae/oe/ue/ss, otherwise underscore. This is the form Funkwacht and Beschattungswächter read. Unticking and uninstalling clear the topics. <b>Container buttons:</b> start, stop, restart, remove and update only act on the plugin’s own container (label <span class='sm-mono'>de.loxberry.plugin.folder</span>, or an old container with a Matter server image when the plugin runs its own container) - the same check as the uninstallation; otherwise the command to type in is shown. <b>Lock brake in the endpoint:</b> the same lock command (<span class='sm-mono'>sperren</span>/<span class='sm-mono'>entsperren</span>) for the same device within 60 s is not sent again (<span class='sm-mono'>UNVERAENDERT=1</span>), a different lock command within 10 s is rejected with HTTP 429 and <span class='sm-mono'>WARTEN_S</span>; if the marker cannot be read, the endpoint answers 503 and sends nothing. Lights, dimming and all other commands never get a 429. <b>Same-value suppression:</b> the same set value (<span class='sm-mono'>ein</span>/<span class='sm-mono'>aus</span>, helligkeit, farbtemperatur, farbe, farbton, saettigung, rollo, soll_heizen, soll_kuehlen, betriebsart, luefter) for the same device within 60 s is not sent again (<span class='sm-mono'>UNVERAENDERT=1</span>), a different value goes out at once; umschalten, rollo_auf/_zu/_stopp, identify, attribut and befehl always go out."
