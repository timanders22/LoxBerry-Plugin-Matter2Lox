; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Matter to Loxone"
K02 = "<b>This plugin is the bridge, not the Matter controller.</b> Matter requires a certified controller with its own fabric, certificates, commissioning over Bluetooth and IPv6 multicast. One already exists: the <i>Matter server</i> of the Open Home Foundation, the very same piece Home Assistant uses. It runs in a container; the plugin talks to its interface, translates the values and passes them on to Loxone."
K03 = "Three prerequisites the plugin cannot create"
K04 = "<b>IPv6.</b> Matter relies on IPv6 link-local multicast. Without IPv6 nothing works at all."
K05 = "<b>A flat network.</b> Multicast filters, mDNS relays and VLANs between the device, the border router and the LoxBerry break Matter — and they break it in a way that makes everything look correctly set up."
K06 = "<b>64 bit.</b> The Matter server explicitly runs on 64-bit systems only."
K07 = "Thread devices additionally need a Thread border router in the house. The LoxBerry is not one."
K08 = "How to proceed"
K09 = "<b>Settings:</b> create and start the container (or enter the address of an existing Matter server), then start the bridge service."
K10 = "<b>Test:</b> the self-check works through the prerequisites in order. Every failed line names the remedy."
K11 = "<b>Commissioning devices:</b> store the Wi-Fi credentials and hand them over, then type in the code from the device."
K12 = "<b>MQTT:</b> enter the subscription in the MQTT gateway. Without that entry nothing arrives at the Miniserver."
K13 = "<b>Loxone integration:</b> step by step, with a list of blocks."
K14 = "How the translation works"
K15 = "Matter delivers numbers without units: a temperature arrives as 2347, a brightness as 178 out of 254, a power reading in milliwatts. The mapping including the conversion lives in a single file (<span class='sm-mono'>matter_cluster.json</span>) that the service and the interface read together. The MQTT tab displays it in full. Anything the plugin does not know can optionally be published raw as well — nothing is lost."
K16 = "What has not been tested"
K17 = "This plugin was built without a Matter device and without a running Matter server. It was tested against a stub that reproduces the documented protocol. Whether the login, the commissioning and the cluster commands hold up against a real device remains to be seen."
K18 = "Basis"
K19 = "All protocol details come from the interface description and the source of the Open Home Foundation Matter server (matter-js/python-matter-server, Apache&nbsp;2.0)."
K20 = "The Matter server is archived"
K21 = "Checked on 06.08.2026: the project moved from <i>home-assistant-libs</i> to the organisation <i>matter-js</i> and was <b>archived there on 23.06.2026</b> — it is read-only. The container image <span class='sm-mono'>ghcr.io/matter-js/python-matter-server:stable</span> <b>is still available</b> (version 8.1.2, published about eight months ago, more than 1.1&nbsp;million pulls). So this plugin does run."
K22 = "In practice this means: new device types and bug fixes no longer appear here but in the successor <i>matterjs-server</i> of the same organisation. Existing installations keep running as long as the image stays available."
K23 = "<b>Not verified</b> is whether the successor speaks the same WebSocket interface. If it does not, moving over would require adapting the bridge service. That is an open question — not a guess in either direction."
