GESPEICHERT = "The settings have been saved, including a backup copy for updates."
H_AKTUALISIEREN = "<b>Pulling the image alone has no effect.</b> The running container is tied to the image id it was created with; only recreating it brings the new state. This button pulls the image and recreates the container if it is newer - with a way back (the old one is removed only once the new one runs) and an automatic fabric backup beforehand. It reports the id before and after. The fabric itself stays untouched. The Matter server is briefly unavailable. This runs in the background; the page shows the progress."
H_BLUETOOTH_ADAPTER = "0 is the built-in adapter of a Raspberry Pi. Without Bluetooth only devices already on the network can be commissioned."
H_CONTAINER = "The Matter server"
H_DIENST = "Bridge service"
H_EIGENER_CONTAINER = "Ticked: the plugin runs the Matter server as a Docker container (above). Unticked: you run the Matter server elsewhere, in which case only address and port matter, and Docker is not needed."
H_ERKANNT = "Detected devices"
H_FABRIC = "Back up the fabric"
H_HERZSCHLAG = "The service reports itself under <span class='sm-mono'>online</span> and <span class='sm-mono'>ts</span> at this interval, even when no value has changed. Without this sign of life a dead service looks exactly like a quiet house in Loxone: the values sent last simply stay put. 0 turns the heartbeat off."
H_MQTT_NUR = "Empty means: all of them. With a bridge exposing fifty endpoints this is the difference between usable and unusable. Separate several numbers with commas. Affects MQTT only - the interface and the Loxone endpoint still see everything."
H_ROH_EIN = "What the plugin does not know would otherwise be lost. When ticked, every unknown attribute is additionally published under <span class='sm-mono'>geraetN/roh/endpoint/cluster/attribute</span> - unconverted. Only cluster 29 is left out: it describes the structure of the device and would be nothing but noise on the broker."
H_SCHLOSS_EIN = "Deliberately a <b>separate</b> checkbox. Anyone letting Loxone switch lamps does not necessarily want it to unlock the front door. Applies to the actions <span class='sm-mono'>sperren</span> and <span class='sm-mono'>entsperren</span>; the general release must be set as well."
H_SENDETAKT = "Shortest interval between two publications. Matter reports every change individually; a dimmer being moved produces hundreds of messages per second. Within the interval changes are collected and then sent in one go - and only those that really changed. 0 sends immediately and in full, as up to 0.9.9."
H_SERVER_PORT = "Default 5580. The service connects to <span class='sm-mono'>ws://address:port/ws</span>."
