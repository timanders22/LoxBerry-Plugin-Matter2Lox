FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_TOPIC = "The topic prefix may only contain letters, digits, hyphen, underscore and slash, and must not be empty."
FEHLER_ZAHL = "%s: please enter a whole number."
