TOKEN_HAKEN = "Without the tick no new token is generated - the addresses in Loxone stay valid."
H_LESETOKEN = "Read token"
LESETOKEN_ERKLAERUNG = "A second token that may <b>only read</b> (%s) - for virtual inputs whose address is in many hands. Nothing can be switched with it and no lock opened. If one is set, the input templates and the addresses above carry it instead of the action token; the outputs still need the action token."
T_LESETOKEN = "Read token"
LESETOKEN_LEER = "none set up"
L_LESETOKEN_JA = "Yes, invalidate the previous read token"
K_LESETOKEN_NEU = "Generate read token"
K_LESETOKEN_LOESCHEN = "Delete read token"
LESETOKEN_HAKEN = "Without the tick the previous read token stays - the addresses in Loxone stay valid."
LESETOKEN_KEINS = "There is no read token - nothing to delete."
LESETOKEN_NEU = "A new read token was generated. <b>Reading addresses in Loxone that carry an earlier read token must be updated</b>; the templates contain the new one."
LESETOKEN_GELOESCHT = "The read token is deleted. Reading addresses with it now answer 403; the templates carry the action token again."
H_ADRESSE = "Address of the LoxBerry for Loxone"
L_ADRESSE = "Host or IP[:port] in the templates"
P_ADRESSE = "empty = LoxBerry IP"
H_ADRESSE_FELD = "Empty = the IP address of the LoxBerry (with port if the web server does not listen on 80). Enter something only if the Miniserver reaches the LoxBerry under a different address - without <span class='sm-mono'>http://</span>, IPv6 in square brackets. Currently: <span class='sm-mono'>%s</span>. Applies to all addresses and templates on this page."
FEHLER_ADRESSE = "The address may contain only letters, digits, dot, hyphen, colon and square brackets (at most 80 characters), without http://. Nothing was saved."
T_VA_LOXFARBE = "Command on ON (analog): colour from the Loxone colour block (RGB BBBGGGRRR or Lumitech 20bbbtttt)"
T_VA_XY = "Command: colour point x/y (each 0 to 1)"
T_VA_LAMELLE = "Command on ON (analog): slat tilt in percent"
S4_IST = "The answer line of a set command optionally carries <span class='sm-mono'>;IST=&lt;value&gt;</span> before <span class='sm-mono'>MELDUNG</span> - the state the device reports afterwards (e.g. for a lock). If it is missing, the service delivered none. <b>Locks:</b> <span class='sm-mono'>sperren</span> always goes out and is never throttled; <span class='sm-mono'>entsperren</span> answers <span class='sm-mono'>UNVERAENDERT=1</span> only if the same command went out within the last 60 s and the lock reports unlocked, and HTTP 429 only within 10 s after a <span class='sm-mono'>sperren</span>. If the same-value lock of a device is held for more than about 2 s, the endpoint answers 503 with <span class='sm-mono'>GRUND=BESCHAEFTIGT</span>."
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
