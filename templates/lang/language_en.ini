[LOX]
EINLEITUNG = "Two routes are available — MQTT is the standard route, the HTTP endpoint the alternative when single values are to be fetched deliberately or commands are to be sent."
H_TITEL = "Loxone integration, step by step"
KEINE_GERAETE = "No devices have been commissioned yet. As soon as the first one is there, its addresses and command recognitions appear here."
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Template for Loxone Config:"
S1_TEXT = "<b>MQTT is the standard route.</b> The gateway creates the names of the virtual inputs itself, and values arrive the moment something changes - for a button or a motion sensor that is the difference between usable and useless. The HTTP route polls and is therefore always one cycle behind; in exchange it can switch."
S1_TITEL = "Step 1: choose the route"
S2_TEXT = "The topic group of this plugin is:"
S2_TITEL = "Step 2: the subscription in the MQTT gateway"
S3_EINZELN = "<b>The more convenient route:</b> the <i>single value</i> column gives an address that returns ONLY the number. A virtual HTTP input using it needs no command recognition at all. Worth it when only one or two values of a device are needed."
S3_NEU_EINLESEN = "<b>After updating to 0.9.10 please generate and import the template again.</b> Two things changed: the search pattern now carries a leading semicolon (without it an input for endpoint 1 could read the value of endpoint 11), and in the ElectricalPowerMeasurement cluster voltage and current sat on the wrong attribute numbers. Existing inputs keep working - but they keep the old fault as well. Loxone Config creates new objects on import and overwrites nothing: delete the old inputs first."
S3_STRICH = "<b>A dash instead of a number</b> means this device does not have that field. No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why <span class='sm-mono'>ALTER</span>, <span class='sm-mono'>OK</span> and <span class='sm-mono'>ERREICH</span> should be evaluated as well."
S3_TEXT = "Over MQTT the inputs appear by themselves. For the HTTP route the address and command recognitions are listed here per detected device - not placeholders, but what is actually reported on your system."
S3_TITEL = "Step 3: create virtual inputs"
S4_ROH = "For everything this list does not cover there are two raw routes: <span class='sm-mono'>aktion=attribut&amp;pfad=E/C/A&amp;wert=...</span> writes any attribute, <span class='sm-mono'>aktion=befehl&amp;cluster=N&amp;name=X&amp;nutzlast=&lt;JSON object&gt;</span> issues any cluster command. The names are those of the Matter SDK. The raw routes block clusters 31, 48, 49, 60, 62 and 63 (access control, commissioning, network, certificates), and cluster 257 (door lock) only works with the box <i>Allow switching locks</i>."
S4_TEXT = "Prerequisite: write commands are enabled in the Settings tab. Create a <i>Virtual output</i> with the address of the LoxBerry, and below it one <i>Virtual output command</i> per command; Loxone replaces <span class='sm-mono'>&lt;v&gt;</span> with the numeric value."
S4_TITEL = "Step 4: switching (virtual output)"
S4_WARNUNG = "<b>The endpoint number matters.</b> A lamp usually switches on endpoint 1; a double socket has two endpoints, and without the right number you switch the wrong one. Which endpoints a device has is shown in the Settings tab in the <i>Reported values</i> column."
S5_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is therefore protected by a token; without a matching token it answers HTTP 403. A new token invalidates every address already entered in the Miniserver."
S5_TITEL = "Step 5: the token"
S6_TEXT = "If a device fails the virtual inputs keep their last value — and everything looks normal in the app. That is why there are two separate indicators: <span class='sm-mono'>OK</span> says whether the bridge is connected to the Matter server at all, <span class='sm-mono'>ERREICH</span> says it per device. Note that a battery sensor only reports every few minutes by itself - so choose thresholds generously, otherwise the system reports a failure where there is merely radio silence. As a side note: <span class='sm-mono'>ALTER</span> avoids any time arithmetic — Loxone counts seconds since 2009-01-01, so a Unix timestamp would first have to be reduced by 1230768000."
S6_TITEL = "Step 6: fault detection"
S7_ERLAEUTERUNG = "<b>On #8 and #10:</b> the notification block only fires on a change from off to on. Never wire several sources directly to its input therefore, but merge them through an OR first — otherwise one permanently active source swallows all the others.<br><b>On #6:</b> the threshold is deliberately high. Matter devices only report on change; a sensor that measures the same temperature for ten minutes has not failed.<br><b>On #14:</b> without debouncing a dimmer sends dozens of commands while the slider is dragged. A Matter device on a radio network will not process them all - and the lamp ends up at the second-to-last value.<br><b>On #15:</b> the comparator trips when the reported state does not match what was sent. That is the most honest failure detection available here: it does not check whether something was sent, but whether it arrived."
S7_TEXT = "What is rebuilt here is a dimmable Matter lamp that Loxone switches and dims and whose failure is reported. Every row is one block; Loxone Config lists them all in the block search (key F5). Rows 1 to 10 are enough if Loxone is only meant to watch."
S7_TITEL = "Step 7: complete block list to rebuild one to one"
S8_TEXT = "Open these three addresses in a browser. If the first answers with values, the second with 403 and the third with 400, then the setup holds."
S8_TITEL = "Step 8: cross-check"
