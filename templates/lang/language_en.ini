Z3_03 = "Status | Für Alexa, Google und Apple freigegeben (Matter) | Rows: V1 = 1 “Gartenlicht on – also switchable by voice and in Alexa, Google Home and Apple Home; living room <v2.1> °C”; without condition “Gartenlicht off; living room <v2.1> °C – both visible via the Matter bridge as soon as it runs in the plugin (tab Bridge)”; visualisation ON | V1 = output Q of #1, V2 = #2"
SEITE1_SCHRITT1 = "In the plugin tab “Settings” set up the Matter server (button “Set up Matter server”) and start the service. Commission the devices in the tab “Commission devices”. If a device is already in Alexa, Google or Apple, open a pairing window there and enter the code here."
SEITE1_SCHRITT2 = "In the plugin tab “MQTT” “Publish values via MQTT” must be on (on by default), and under System → MQTT Gateway the autostart. Gateway version 1: the plugin creates the subscription matter/# itself. Version 2: in the subscriptions set the ticks from step 1 of this tab, for matter_status_ok and the three inputs …_erreichbar also “Noncached”."
SEITE1_SCHRITT3 = "Create the virtual inputs no. 1, 2 and 9 to 11 by hand (Periphery → Virtual Inputs), title exactly as in the table – that is their name in the MQTT gateway (name table in step 2 of this tab, with copy button). Do not tick “Use as digital input”. The LoxBerry user in the Miniserver needs rights on the inputs."
SEITE1_SCHRITT4 = "Create the page “Matter2Lox”, drag the inputs onto it, plus the constant “Konstante 1” (no. 3; already present in the sample project). Create two notifications (Periphery → Messages): “Meldung Plugin gestört (Matter)” and “Meldung Gerät antwortet nicht (Matter)”, text as in the table."
SEITE1_SCHRITT5 = "Place the remaining blocks via the block search (F5), parameters as in the table, connect from top to bottom. On the value validator (no. 4) remove the tick at ‘En’ in the properties window – Config creates En inverted, otherwise the constant 1 arrives as 0. On the AND no. 15 invert input I2: click on the input point, afterwards the input shows a small circle. On the status “Zustand (Matter)” click “+” twice beforehand (V5 and V6); enter the rows in the given order, the one without condition last."
SEITE1_SCHRITT6 = "Save and transfer. Check: “Zustand (Matter)” shows “läuft – Lebenszeichen …”, and the number changes every minute."
SEITE1_H1 = "The message only comes after 10 minutes of fault; if the plugin is silent altogether, after about 15 minutes (5 minutes until the sign of life is missing plus 10 minutes)."
SEITE1_H2 = "<b>On no. 2 and 4:</b> The sign of life counts up with every heartbeat of the plugin (default 60 s) and wraps around from 999 to 0. If the heartbeat in the tab Settings is 0, none arrives – then no. 8 reports a fault."
SEITE1_H3 = "<b>On no. 1 and 9 to 11:</b> They arrive every minute with the same value. Under gateway version 2 therefore tick “Noncached” – otherwise they stay at 0 (“no connection”) after a restart of the Miniserver until the value changes."
SEITE1_H4 = "<b>On no. 15:</b> With a faulty plugin all devices report “does not answer”; the AND with the inverted input then only lets message no. 8 through."
SEITE1_H5 = "Further devices: create the input …_erreichbar per device (name from the name table). A device on mains power gets a NOT and one more OR in front of no. 15 – never several sources directly at the notification. Show battery devices in the status only."
SEITE1_H6 = "If you still use the HTTP inputs (MATTER_1_OK, MATTER_1_ALTER …) and matter_ts from 0.9.43: they keep working as long as “Accept HTTP endpoint for Loxone” is ticked in the plugin (set after the update). To switch over: create the inputs as above, move the wires, delete the old containers."
SEITE2_SCHRITT1 = "In the plugin tab “MQTT” tick “Accept commands via MQTT” and in the tab “Settings” “Allow write commands”, save each. Without both Loxone switches nothing (acknowledgement “abgelehnt”)."
SEITE2_SCHRITT2 = "The commands no. 6, 8 and 18 are created at the shared virtual output “LoxBerry MQTT-Gateway” (address /dev/udp/<LoxBerry>/11884, already present in the sample project): one virtual output command per command, title and command as in the table. More convenient: in step 3 of this tab the button “MQTT command template” per device (own output with all commands of the device)."
SEITE2_SCHRITT3 = "Create the virtual inputs of the page by hand, title exactly as in the table (e.g. matter_geraet1_1_schalter, matter_geraet4_1_taste_kurz). The number after “geraet” is the device number from the tab Settings, the number after it the endpoint; the name table in step 2 of this tab lists your own."
SEITE2_SCHRITT4 = "Create the page “Matter2Lox Geräte”, drag the inputs and commands onto it, place the remaining blocks via F5. On the dimmer (no. 5) set Sts 5 and Str 0.5. Draw the wires into the inputs Tg of the dimmer (no. 5) and the switch (no. 17) by hand. Create the notification “Meldung Bewegung bei Abwesenheit (Matter)” (Periphery → Messages)."
SEITE2_SCHRITT5 = "Save and transfer. Check: dim the reading lamp in the app – within seconds “Leselampe Rückmeldung (Matter)” shows “an – …”. Press the push button briefly, the lamp toggles."
SEITE2_H1 = "Feedback and commands go via MQTT: states arrive within seconds and are back immediately after a restart (retained). -1 means “no value” – the statuses catch it before the number rows."
SEITE2_H2 = "<b>On no. 5 and 6:</b> Only the brightness goes out (0 switches off, 1 to 100 switches on) – one command per change. Sts and Str limit the commands while dimming; the plugin sends the same value to the lamp at most once per minute."
SEITE2_H3 = "<b>On no. 10 to 12:</b> “does not follow” is a hint, not a message: the lamp may also be switched from Alexa, Google, Apple or on the device. The status then shows the real state; the dimmer in Loxone stays where it was."
SEITE2_H4 = "The endpoint numbers (matter_geraet3_2_feuchte …) are examples; a double socket has two endpoints. The name table in step 2 lists your own."
SEITE2_H5 = "For colour lamps there is the command …/loxfarbe (RGB or Lumitech from the output of a lighting controller), plus farbton, saettigung, rollo, lamelle, soll_heizen, soll_kuehlen, betriebsart, luefter and identify – the table in step 3 of this tab. The sample project has no lighting controller."
SEITE2_H6 = "The plugin only switches locks with “Allow locks to be operated”, unlocking via MQTT additionally only with “Allow unlocking locks via MQTT”; the sample deliberately has none. Also not in the sample: blinds, thermostat, fan and wallbox (same form as the lamp). A Matter smoke detector comes the same way: matter_geraet&lt;N&gt;_1_rauch_alarm, 1/2 = alarm, to a notification ‘urgent’."
SEITE3_SCHRITT1 = "In Loxone Config create a separate user “matterbridge” in a separate group, not the admin. The group needs the right “Website/Apps”. Grant rights only on the rooms or blocks that are to appear in Alexa. Set “Use in User Interface” on each of these blocks, then save to the Miniserver."
SEITE3_SCHRITT2 = "In the plugin tab “Bridge” tick “Run the bridge (beta, off by default)”. In step 2 there enter user and password, press “Save and check login”, then “Set up bridge”. A wrong password locks the user after a few attempts; the plugin therefore checks only once."
SEITE3_SCHRITT3 = "In the Bridge tab step 3 tick the blocks (“Gartenlicht (Matter-Bridge)” as “light”, “Raumtemperatur Wohnzimmer (eigene Quelle)” as temperature) and press “Apply selection”."
SEITE3_SCHRITT4 = "In the Alexa app: add device → Matter, scan the QR code from step 4 of the Bridge tab. Google needs a developer project once (instructions in the Bridge tab)."
SEITE3_SCHRITT5 = "Create the page “Matter2Lox Bridge” as in the table. Check: “Alexa, turn on Gartenlicht” – the status shows “Gartenlicht an”."
SEITE3_H1 = "The bridge is beta and has not yet been measured on a real device through the plugin."
SEITE3_H2 = "It reports nothing back to Loxone; only the Bridge tab shows its state. A login error arrives as a LoxBerry notification."
SEITE3_H3 = "Offered are switches, push buttons, blinds, sensors (temperature, humidity, air pressure) and the circuits of a lighting controller. Gates, doors, alarm, room controllers and radio buttons are deliberately not offered. Alexa shows at most 50 devices."
SEITE3_H4 = "Do not additionally share a Matter device that is already directly in Alexa (e.g. the reading lamp) via a Loxone block – otherwise it appears twice in Alexa."

[EINST]
CONTAINER_ERKLAERUNG = "The Matter server runs in a container because it needs three things an ordinary program does not get: the host network for mDNS, Bluetooth via D-Bus and its own data folder for the fabric. The command line under „For advanced users“ follows the Matter server documentation verbatim - it is shown there so you can reproduce it by hand. Docker comes with the LoxBerry plugin <b>Docker NG</b> (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>)."
CONTAINER_FEHL = "Container: %s failed."
CONTAINER_OK = "Container: %s done."
DIENST_ERKLAERUNG = "The bridge service keeps the connection to the Matter server open and receives every change immediately - there is no polling interval. The user interface and the Miniserver only read the cache. A watchdog running every minute restarts the service if it crashes; a service stopped by hand stays stopped."
DIENST_RESTART = "Service restarted."
DIENST_START = "Service started."
DIENST_STOP = "Service stopped."
ARCHIV_VERWEIGERT = "This interface runs from an unpacked archive, not from the installation. Service and container are not touched from here."
FRIST_ABGELAUFEN = "Aborted after %d seconds without an answer."
FABRIC_SICHERN_ERKLAERUNG = "The data folder holds the <b>fabric and the certificates</b> of this controller. No archive ships them, and whoever loses them has to factory-reset and re-commission every device. <b>Stop the container before backing up</b>, otherwise the archive is taken from an open file."
FABRIC_WARNUNG = "<b>Since 0.9.17 the fabric and certificates live NEXT TO the data folder</b> and therefore survive every plugin update. Up to 0.9.16 they were inside it - and the LoxBerry installer wipes the data folder on every update, so every device had to be commissioned again. <i>Remove container</i> only removes the container; the commissioned devices survive and are back after <i>Set up Matter server</i>. If you delete the data folder by hand, however, every device has to be commissioned again - and the devices themselves must be factory reset first, because otherwise they are still bound to a fabric that no longer exists."
FABRIC_ZURUECK = "By hand it works like this, with the container stopped:"
