BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
VORLAGE_KOMMENTAR = "Generated by the LoxBerry plugin Matter to Loxone"
VORLAGE_KOMMENTAR_ALLE = "All devices in one file. Generated by the LoxBerry plugin Matter to Loxone"
VQ_KOMMENTAR = "Write commands must be allowed in the Settings tab. Generated by the LoxBerry plugin Matter to Loxone"
S0_MQTT = "The sample project gets values via MQTT and sends commands via MQTT. The HTTP route (token) is below for existing installations – it is only active if ‘Accept HTTP endpoint for Loxone’ is ticked."
MQ1_TITEL = "Step 1: Values via MQTT"
MQ1_TEXT = "The plugin sends every value through the UDP input of the MQTT gateway as soon as it changes, plus a sign of life every minute. Under <i>System → MQTT Gateway</i> the autostart must be on. <b>Gateway version 1:</b> the plugin creates the subscription itself (file <span class='sm-mono'>mqtt_subscriptions.cfg</span>), there is nothing to enter. The topic group:"
MQ1_AUS = "In the tab MQTT “Publish values via MQTT” is off – then nothing arrives in Loxone."
MQ1_V2 = "<b>Gateway version 2:</b> in the <i>Subscriptions</i> tick only the data points Loxone needs. For the sample project these are the 17 below; “Noncached” for those arriving every minute with the same value, “Resetaftersend” for the button pulses:"
MQ1_RECONNECT = "The page “LoxBerry MQTT-Gateway” of the sample project sends “reconnect” once after a restart of the Miniserver – then all values arrive anew at once. The heartbeat in the tab Settings must not be 0, otherwise there is no sign of life."
MQ2_TITEL = "Step 2: Virtual inputs – the names"
MQ2_TEXT = "One plain <i>Virtual Input</i> per value (Periphery → Virtual Inputs), title exactly as the MQTT gateway assigns it – the table lists the names from your devices. The device numbers are fixed; they survive every update."
MQ2_KEINE_GERAETE = "No devices are commissioned yet – the table only shows the signs of life. As soon as the first device is there, its names appear here."
MQ2_EINGANG = "Do not tick “Use as digital input”; texts (manufacturer, firmware) as <i>Virtual Text Input</i>. The LoxBerry user in the Miniserver needs rights on the inputs."
MQ2_FEHLWERT = "<b>-1</b> (for signed set points <b>-999</b>) means “no statement” – the device does not report the state. The statuses of the sample project catch it before the number rows. Measured values without a value do not arrive at all."
MQ2_PRAEFIX = "A different topic prefix (tab MQTT) changes all names – then rename the inputs."
KOPIEREN = "Copy"
KOPIERT = "Copied"
T_NAME_GATEWAY = "Name in Loxone (title)"
T_ART = "Kind"
T_V2 = "Gateway version 2"
V2_N = "tick + Noncached"
V2_R = "tick + Resetaftersend"
V2_HAKEN = "tick"
ART_ZAHL = "number"
ART_TEXT = "text"
MQ3_TITEL = "Step 3: Commands via MQTT"
MQ3_TEXT = "Loxone sends commands through the UDP input of the MQTT gateway (<span class='sm-mono'>publish &lt;topic&gt; &lt;value&gt;</span>); the command bridge of the plugin listens on %s and acknowledges every command under <span class='sm-mono'>…/quittung</span>. It checks like the HTTP endpoint: permissions, ranges, lock brake and “the same value at most once per minute”."
MQ3_HAKEN_AUS = "In the tab MQTT “Accept commands via MQTT” is off – commands are not accepted."
MQ3_STEUERUNG_AUS = "In the tab Settings “Allow write commands” is off – switching commands are rejected (only abruf works)."
MQ3_KEINE = "The command bridge is missing or its table is broken (tab Test, row “command bridge”)."
MQ3_ADRESSE = "The topic carries <i>geraet&lt;N&gt;</i> with the device number from the tab Settings (e.g. geraet1) and <i>&lt;E&gt;</i> for the endpoint (usually 1), as in the values: command matter/befehl/geraet1/1/schalter, feedback matter/geraet1/1/schalter."
MQ3_SCHLOSS = "<b>Locks:</b> sperren and entsperren additionally need “Allow locks to be operated” (tab Settings); entsperren via MQTT also “Allow unlocking locks via MQTT” (tab MQTT, off by default). Not via MQTT: commissioning, paired systems, raw routes and the Matter bridge – they stay in the web interface."
MQ3_NICHTS = "For commands there is nothing to enter under gateway version 1 or 2. A queued command expires after 30 s; without a connection to the Matter server it is rejected."
MQ3_VORLAGE = "The template creates its own virtual output with the address %s (all commands of the device, never retain). The sample project attaches its commands to the shared output “LoxBerry MQTT-Gateway” instead. The host comes from “Address of the LoxBerry for Loxone” in the HTTP section below."
K_VORLAGE_MQTT = "MQTT command template:"
MQ4_TITEL = "Step 4: Failure detection"
MQ4_TEXT = "If the plugin fails, the virtual inputs keep their last value – in the app everything looks normal. That is why <span class='sm-mono'>status/zaehler</span> counts up with every heartbeat (0 to 999). It belongs on a <b>value validator</b> (Tmc 300 s, Min 0, Max 999) – if the counter stops, it reports. <span class='sm-mono'>status/ok</span> tells whether the service is connected to the Matter server, <span class='sm-mono'>geraetN/erreichbar</span> per device whether it answers. The page “Matter2Lox” in step 5 shows it fully connected."
MQ4_HERZSCHLAG_AUS = "The heartbeat in the tab Settings is 0 – then no sign of life arrives, and the failure detection reports a fault."
H_HTTP = "Existing installations and third-party systems: values and commands via HTTP (token)"
HTTP_TEXT = "The HTTP endpoint with a token remains for projects set up before 0.9.44 and for third-party systems. The sample project does not need it – it is off on a new installation; after an update it stays on."
HTTP_AUS = "The HTTP endpoint is off. Addresses, templates and token of the HTTP route appear here as soon as the box above is ticked and saved."
L_ENDPUNKT_EIN = "Accept HTTP endpoint for Loxone"
H_ENDPUNKT_EIN = "Only for existing Loxone projects and third-party systems with a token. The sample project does not need it. Off means: every call of <span class='sm-mono'>/plugins/…/index.php</span> answers HTTP 403 <span class='sm-mono'>GRUND=ENDPUNKT_AUS</span>, reading as well as switching."

