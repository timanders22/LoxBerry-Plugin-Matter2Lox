A_ENDPUNKT = "endpoint %s"
S4_GLEICHWERT = "<b>The same value goes out at most once a minute.</b> If a virtual output sends the same set value (on/off, brightness, colour, hue, saturation, colour temperature, Loxone colour, colour point, blind position, slat tilt, set temperatures, operating mode, fan) to the same device again within 60 s, the endpoint answers <span class='sm-mono'>SET;OK=1;AKTION=…;UNVERAENDERT=1</span> and sends nothing. A different value goes out at once. Toggle, blind up/down/stop, identify and the raw paths always go out. What is remembered is what went out through the endpoint: if someone switches at the device, in an app or in the Test tab within the same minute, the next identical Loxone command is still suppressed."
