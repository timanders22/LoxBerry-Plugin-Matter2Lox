GERAET_LEEREN_FEHL = "Device %d: the topics could not be cleared completely (return code %d)."
GERAET_LEEREN_UNBEKANNT = "This device number is not known - nothing was cleared."
GERAET_LEEREN_HAKEN = "Device %d: without the tick “Yes, clear” nothing is cleared."
