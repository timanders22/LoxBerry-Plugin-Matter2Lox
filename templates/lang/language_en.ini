LEEREN_KEIN_PYTHON = "Python or %s is missing - nothing was cleared."
L_TUER_HAUS = "Additionally report doors and locks under the house topic"
H_TUER_HAUS = "Off by default. When ticked the plugin additionally reports every contact sensor under <span class='sm-mono'>haus/tuer/&lt;name&gt;/offen</span> (1 open, 0 closed) and every door lock under <span class='sm-mono'>haus/tuer/&lt;name&gt;/verriegelt</span> (1 locked, 0 not locked), both retained; without a statement it reads <span class='sm-mono'>-</span>. Funkwacht and Beschattungswächter read this form. &lt;name&gt; is the device label in lower case, umlauts as ae/oe/ue/ss, every other character as underscore (Haustür becomes haustuer). Needs <i>Publish values via MQTT</i>. Unticking clears the reported topics in the broker."
DOCKER_FEHLT = "<b>Docker is missing.</b> The plugin runs the Matter server as a Docker container. Docker can be installed with the LoxBerry plugin <b>Docker NG</b> (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>; the older plugin Docker works as well); reload this page afterwards. Or run a Matter server on another machine: untick „Let this plugin run the Matter server (Docker)“ below and just enter its address."
DOCKER_KEIN_ZUGRIFF = "<b>No access to Docker.</b> Docker is installed but does not answer the plugin: the user <span class='sm-mono'>loxberry</span> must be in the group <span class='sm-mono'>docker</span>, and the Docker service must be running. The LoxBerry plugin <b>Docker NG</b> sets up both (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>); by hand: <span class='sm-mono'>sudo usermod -aG docker loxberry</span> and log in again. Reload this page afterwards. A Matter server on another machine works as well: untick „Let this plugin run the Matter server (Docker)“ and just enter its address."
