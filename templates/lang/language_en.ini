WAS_IST_DAS = "<b>This plugin is the bridge, not the Matter controller.</b> Matter requires a certified controller with its own fabric, certificates, Bluetooth commissioning and IPv6 multicast. That exists ready made: the Open Home Foundation <i>Matter Server</i> - the same component Home Assistant uses. It runs in its own container; this plugin talks to its interface, translates the values and passes them on to Loxone."
