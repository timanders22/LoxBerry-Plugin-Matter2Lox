EINRICHTEN_HILFE = "<b>Set up Matter server</b> pulls the image if it is still missing, creates the container with the command line under „For advanced users“ and starts it. This runs in the background - the first time several minutes, at most 15; the page shows the progress and reloads when it has finished. If the own container already exists, it is only started if it is stopped. A foreign container with the same name is never touched, and no second one is created next to an own one under a different name."
EIGENER_SERVER = "A Matter server is configured that the plugin does not run itself (the box „Let this plugin run the Matter server (Docker)“ is off). Only the address <span class='sm-mono'>%s</span> is used; Docker is not needed for that, and the plugin sets up no container."
H_FORTGESCHRITTEN = "For advanced users: single steps and command line"
FORTGESCHRITTEN = "The same steps one by one. They only act on the own container (label <span class='sm-mono'>de.loxberry.plugin.folder</span> or a legacy container of this plugin with /data from its fabric) - the same check as the uninstall. <i>Pull image again</i> runs in the background; only the buttons <i>Set up Matter server</i>, <i>Update Matter server</i> and <i>Apply settings</i> create a container."
A_UNGEMESSEN = "The state is measured when the Settings tab is loaded: <a href='index.php?form=settings'>reload Settings</a>."
