[EINST]
CONTAINER_ERKLAERUNG = "The Matter server runs in a container because it needs three things an ordinary program does not get: the host network for mDNS, Bluetooth via D-Bus and its own data folder for the fabric. The command line under „For advanced users“ follows the Matter server documentation verbatim - it is shown there so you can reproduce it by hand. Docker comes with the LoxBerry plugin <b>Docker NG</b> (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>)."
CONTAINER_FEHL = "Container: %s failed."
CONTAINER_OK = "Container: %s done."
DIENST_ERKLAERUNG = "The bridge service keeps the connection to the Matter server open and receives every change immediately - there is no polling interval. The user interface and the Miniserver only read the cache. A watchdog running every minute restarts the service if it crashes; a service stopped by hand stays stopped."
DIENST_RESTART = "Service restarted."
DIENST_START = "Service started."
DIENST_STOP = "Service stopped."
ARCHIV_VERWEIGERT = "This interface runs from an unpacked archive, not from the installation. Service and container are not touched from here."
FRIST_ABGELAUFEN = "Aborted after %d seconds without an answer."
FABRIC_SICHERN_ERKLAERUNG = "The data folder holds the <b>fabric and the certificates</b> of this controller. No archive ships them, and whoever loses them has to factory-reset and re-commission every device. <b>Stop the container before backing up</b>, otherwise the archive is taken from an open file."
FABRIC_WARNUNG = "<b>Since 0.9.17 the fabric and certificates live NEXT TO the data folder</b> and therefore survive every plugin update. Up to 0.9.16 they were inside it - and the LoxBerry installer wipes the data folder on every update, so every device had to be commissioned again. <i>Remove container</i> only removes the container; the commissioned devices survive and are back after <i>Set up Matter server</i>. If you delete the data folder by hand, however, every device has to be commissioned again - and the devices themselves must be factory reset first, because otherwise they are still bound to a fabric that no longer exists."
FABRIC_ZURUECK = "By hand it works like this, with the container stopped:"
FEHLER_ABBILD = "The image does not look like a Docker image name."
