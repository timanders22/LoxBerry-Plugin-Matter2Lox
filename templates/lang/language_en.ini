[LOX]
EINLEITUNG = "The sample project gets values via MQTT and sends commands via MQTT – steps 1 to 4. The HTTP route with a token is collapsed below, for existing installations and third-party systems."
H_TITEL = "Loxone integration, step by step"
KEINE_GERAETE = "No devices have been commissioned yet. As soon as the first one is there, its addresses and command recognitions appear here."
K_TOKEN_NEU = "Generate new token"
K_VORLAGE = "Template for Loxone Config:"
S3_EINZELN = "<b>The more convenient route:</b> the <i>single value</i> column gives an address that returns ONLY the number. A virtual HTTP input using it needs no command recognition at all. Worth it when only one or two values of a device are needed."
S3_STRICH = "<b>A dash instead of a number</b> means this device does not have that field. No 0 is sent on purpose — a 0 would be a silent false statement. Loxone then keeps the last valid value. That is exactly why <span class='sm-mono'>ALTER</span>, <span class='sm-mono'>OK</span> and <span class='sm-mono'>ERREICH</span> should be evaluated as well."
S3_TEXT = "For the HTTP route the address and command recognitions are listed here per detected device - not placeholders, but what is actually reported on your system."
S3_TITEL = "HTTP 1: Virtual HTTP inputs"
S4_ROH = "For everything this list does not cover there are two raw routes: <span class='sm-mono'>aktion=attribut&amp;pfad=E/C/A&amp;wert=...</span> writes any attribute, <span class='sm-mono'>aktion=befehl&amp;cluster=N&amp;name=X&amp;nutzlast=&lt;JSON object&gt;</span> issues any cluster command. The names are those of the Matter SDK. The raw routes block clusters 31, 48, 49, 60, 62 and 63 (access control, commissioning, network, certificates), and cluster 257 (door lock) only works with the box <i>Allow switching locks</i>. Switch true/false attributes via ‘befehl’ (e.g. OnOff On/Off), not via ‘attribut’ – the raw route only takes numbers there."
S4_TEXT = "Prerequisite: write commands are enabled in the Settings tab. Create a <i>Virtual output</i> with the address of the LoxBerry, and below it one <i>Virtual output command</i> per command; Loxone replaces <span class='sm-mono'>&lt;v&gt;</span> with the numeric value."
S4_TITEL = "HTTP 2: Switching (virtual HTTP output)"
S4_WARNUNG = "<b>The endpoint number matters.</b> A lamp usually switches on endpoint 1; a double socket has two endpoints, and without the right number you switch the wrong one. Which endpoints a device has is shown in the Settings tab in the <i>Reported values</i> column."
S5_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials. It is therefore protected by a token; without a matching token it answers HTTP 403. A new token invalidates every address already entered in the Miniserver."
S5_TITEL = "HTTP 3: The token"
S6_TEXT = "If a device fails the virtual inputs keep their last value — and everything looks normal in the app. That is why there are two separate indicators: <span class='sm-mono'>OK</span> says whether the bridge is connected to the Matter server at all, <span class='sm-mono'>ERREICH</span> says it per device. Note that a battery sensor only reports every few minutes by itself - so choose thresholds generously, otherwise the system reports a failure where there is merely radio silence. <span class='sm-mono'>ALTER</span> is a <b>sign of life, not an age limit</b>: the endpoint computes it anew on every poll, but in a quiet house it grows up to about 30 minutes, because the plugin only writes on changes. It belongs on a value validator (if the LoxBerry stops, the value stands still), never on a threshold switch - the page “Matter2Lox” in step 7 shows it. As a side note: <span class='sm-mono'>ALTER</span> avoids any time arithmetic — Loxone counts seconds since 2009-01-01, so a Unix timestamp would first have to be reduced by 1230768000."
S6_TITEL = "HTTP 4: Failure detection via HTTP"
S7_TEXT = "Three pages from the LoxBerry plugins sample project, fully connected: “Matter2Lox” (is the plugin running, do the devices answer), “Matter2Lox Geräte” (see and switch Matter devices in Loxone) and “Matter2Lox Bridge” (Loxone blocks in Alexa, Google Home and Apple Home – the other direction). Every row is one block; Loxone Config lists them in the block search (key F5). The names are those of the sample project (device 1 Leselampe, 2 Steckdose Terrasse, 3 Klimasensor Bad, 4 Taster Flur, 5 motion sensor); your own gateway names are listed in step 2, your own commands in step 3. If you only want monitoring, take over the first page."
S7_TITEL = "Step 5: Three ready pages from the sample project"
S8_TEXT = "Open these three addresses in a browser. If the first answers with values, the second with 403 and the third with 400, then the setup holds."
S8_TITEL = "HTTP 5: Cross-check"
TOKEN_NEU = "A new token has been generated. <b>The addresses in Loxone have to be adjusted</b> — the old ones no longer work."
