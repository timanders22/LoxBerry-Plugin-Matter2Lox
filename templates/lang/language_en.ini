UMSTIEG_ERKLAERUNG = "<b>Beta, untested with this plugin.</b> The python-matter-server is archived; its successor <span class='sm-mono'>matterjs-server</span> offers the same WebSocket interface according to its documentation and takes over the fabric from the same data folder on first start (<span class='sm-mono'>chip.json</span>, <span class='sm-mono'>&lt;fabricId&gt;.json</span>); it keeps writing the Python files, so a way back is possible. The button sets the image to <span class='sm-mono'>ghcr.io/matter-js/matterjs-server:stable</span>, saves and recreates the container in the background - the fabric is backed up automatically first, and if the new one does not start, the old one comes back. The plugin adapts the command line: without <span class='sm-mono'>--paa-root-cert-dir</span> (not supported), with <span class='sm-mono'>--fabricid 1</span> (by default it picks one at random) and with <span class='sm-mono'>--user</span> = owner of the fabric folder (it runs without root). Bluetooth without root in particular is untested. Both servers must never run on the same fabric at the same time - the Test tab checks this."
