GERAET_LEEREN_HILFE = "<b>Last seen</b> is the time of the last message the Matter server delivered for the device (value change, new device data, key press); fetching the inventory when connecting does not count. An update of the plugin starts the record afresh. <b>Clear this device’s topics</b> deletes the retained MQTT topics of this one device in the broker (<span class='sm-mono'>prefix/geraetN/…</span> and, if switched on, its topics under <span class='sm-mono'>haus/tuer/</span>) and then reads back from the broker. Other devices, the device itself, the fabric and the addresses in Loxone stay untouched. The button is meant for removed and deselected devices: if the service keeps reporting the device, its states are back in the broker after the next full publication (30 minutes) at the latest. Without the tick nothing happens."
