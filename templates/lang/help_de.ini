; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Matter to Loxone"
K02 = "<b>Dieses Plugin ist die Brücke, nicht der Matter-Controller.</b> Matter verlangt einen zertifizierten Controller mit eigener Fabric, Zertifikaten, Inbetriebnahme über Bluetooth und IPv6-Multicast. Den gibt es fertig: den <i>Matter-Server</i> der Open Home Foundation, dasselbe Stück, das auch Home Assistant benutzt. Er läuft in einem Container; das Plugin spricht seine Schnittstelle an, übersetzt die Werte und reicht sie an Loxone weiter."
K03 = "Drei Voraussetzungen, die das Plugin nicht herstellen kann"
K04 = "<b>IPv6.</b> Matter beruht auf IPv6-Link-Local-Multicast. Ohne IPv6 läuft gar nichts."
K05 = "<b>Ein flaches Netz.</b> Multicast-Filter, mDNS-Weiterleitungen und VLANs zwischen Gerät, Border-Router und LoxBerry machen Matter kaputt — und zwar so, dass alles richtig eingerichtet aussieht."
K06 = "<b>64 Bit.</b> Der Matter-Server läuft ausdrücklich nur auf 64-Bit-Systemen."
K07 = "Thread-Geräte brauchen zusätzlich einen Thread-Border-Router im Haus. Der LoxBerry ist keiner."
K08 = "So gehen Sie vor"
K09 = "<b>Einstellungen:</b> Container anlegen und starten (oder die Adresse eines vorhandenen Matter-Servers eintragen), dann den Brückendienst starten."
K10 = "<b>Test:</b> Die Selbstprüfung geht die Voraussetzungen der Reihe nach durch. Jedes Kreuz nennt die Abhilfe mit."
K11 = "<b>Geräte anlernen:</b> WLAN-Zugangsdaten hinterlegen und übergeben, dann den Code vom Gerät eintippen."
K12 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K13 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit Baustein-Liste."
K14 = "Wie übersetzt wird"
K15 = "Matter liefert Zahlen ohne Einheit: eine Temperatur kommt als 2347, eine Helligkeit als 178 von 254, eine Leistung in Milliwatt. Die Zuordnung samt Umrechnung steht in einer einzigen Datei (<span class='sm-mono'>matter_cluster.json</span>), die Dienst und Oberfläche gemeinsam lesen. Der Reiter MQTT zeigt sie vollständig an. Was das Plugin nicht kennt, lässt sich auf Wunsch roh mitveröffentlichen — verloren geht nichts."
K16 = "Was ungeprüft ist"
K17 = "Dieses Plugin wurde ohne Matter-Gerät und ohne laufenden Matter-Server gebaut. Geprüft wurde es gegen eine Attrappe, die das dokumentierte Protokoll nachbildet. Ob die Anmeldung, die Inbetriebnahme und die Cluster-Befehle am echten Gerät tragen, muss sich erst zeigen."
K18 = "Grundlage"
K19 = "Alle Protokollangaben stammen aus der Schnittstellenbeschreibung und dem Quelltext des Open-Home-Foundation-Matter-Servers (matter-js/python-matter-server, Apache&nbsp;2.0)."
K20 = "Der Matter-Server ist archiviert"
K21 = "Nachgesehen am 06.08.2026: Das Projekt ist von <i>home-assistant-libs</i> in die Organisation <i>matter-js</i> umgezogen und wurde dort am <b>23.06.2026 archiviert</b> — es ist schreibgeschützt. Das Container-Abbild <span class='sm-mono'>ghcr.io/matter-js/python-matter-server:stable</span> <b>gibt es weiterhin</b> (Fassung 8.1.2, veröffentlicht vor rund acht Monaten, über 1,1&nbsp;Millionen Abrufe). Dieses Plugin läuft also."
K22 = "Praktisch heißt das: Neue Gerätetypen und Fehlerbehebungen entstehen nicht mehr hier, sondern im Nachfolger <i>matterjs-server</i> derselben Organisation. Bestehende Installationen laufen weiter, solange das Abbild abrufbar bleibt."
K23 = "Nachgesehen am 17.08.2026: Der Nachfolger beschreibt sich selbst als <i>drop-in replacement</i> mit einer zum Python Matter Server kompatiblen WebSocket-Schnittstelle und nennt fünf gewollte Abweichungen - keine davon berührt einen Weg, den dieses Plugin benutzt. Ein Praxistest ist das nicht, aber der frühere Vorbehalt &#8222;nicht geprüft&#8220; war einer, den man hätte nachsehen können."
