; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Matter to Loxone"
K02 = "<b>Dieses Plugin ist die Brücke, nicht der Matter-Controller.</b> Matter verlangt einen zertifizierten Controller mit eigener Fabric, Zertifikaten, Inbetriebnahme über Bluetooth und IPv6-Multicast. Den gibt es fertig: den <i>Matter-Server</i> der Open Home Foundation, dasselbe Stück, das auch Home Assistant benutzt. Er läuft in einem Container; das Plugin spricht seine Schnittstelle an, übersetzt die Werte und reicht sie an Loxone weiter."
K03 = "Drei Voraussetzungen, die das Plugin nicht herstellen kann"
K04 = "<b>IPv6.</b> Matter beruht auf IPv6-Link-Local-Multicast. Ohne IPv6 läuft gar nichts."
K05 = "<b>Ein flaches Netz.</b> Multicast-Filter, mDNS-Weiterleitungen und VLANs zwischen Gerät, Border-Router und LoxBerry machen Matter kaputt — und zwar so, dass alles richtig eingerichtet aussieht."
K06 = "<b>64 Bit.</b> Der Matter-Server läuft ausdrücklich nur auf 64-Bit-Systemen."
K07 = "Thread-Geräte brauchen zusätzlich einen Thread-Border-Router im Haus. Der LoxBerry ist keiner."
K08 = "So gehen Sie vor"
K09 = "<b>Einstellungen:</b> Knopf <i>Matter-Server einrichten</i> drücken - er holt das Abbild, legt den Container an und startet ihn, im Hintergrund; die Ampel darunter zeigt den Stand. Docker dafür bringt das LoxBerry-Plugin <b>Docker NG</b> mit (<a href='https://github.com/timanders22/LoxBerry-Plugin-Docker-NG' target='_blank' rel='noopener'>github.com/timanders22/LoxBerry-Plugin-Docker-NG</a>; das ältere Plugin Docker geht auch). Wer schon einen Matter-Server auf einem anderen Rechner hat, nimmt den Haken „Matter-Server von diesem Plugin betreiben lassen (Docker)“ ab und trägt nur dessen Adresse ein. Danach den Brückendienst starten."
K10 = "<b>Test:</b> Die Selbstprüfung geht die Voraussetzungen der Reihe nach durch. Jedes Kreuz nennt die Abhilfe mit."
K11 = "<b>Geräte anlernen:</b> WLAN-Zugangsdaten hinterlegen und übergeben, dann den Code vom Gerät eintippen."
K12 = "<b>MQTT:</b> Das Abo im MQTT-Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1.</b> Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions; einzutragen ist dann nichts."
K13 = "<b>Einbindung in Loxone:</b> Schritt für Schritt, mit Baustein-Liste."
K14 = "Wie übersetzt wird"
K15 = "Matter liefert Zahlen ohne Einheit: eine Temperatur kommt als 2347, eine Helligkeit als 178 von 254, eine Leistung in Milliwatt. Die Zuordnung samt Umrechnung steht in einer einzigen Datei (<span class='sm-mono'>matter_cluster.json</span>), die Dienst und Oberfläche gemeinsam lesen. Der Reiter MQTT zeigt sie vollständig an. Was das Plugin nicht kennt, lässt sich auf Wunsch roh mitveröffentlichen — verloren geht nichts."
K16 = "Was ungeprüft ist"
K17 = "Dieses Plugin wurde ohne Matter-Gerät und ohne laufenden Matter-Server gebaut. Geprüft wurde es gegen eine Attrappe, die das dokumentierte Protokoll nachbildet. Ob die Anmeldung, die Inbetriebnahme und die Cluster-Befehle am echten Gerät tragen, muss sich erst zeigen."
K18 = "Grundlage"
K19 = "Alle Protokollangaben stammen aus der Schnittstellenbeschreibung und dem Quelltext des Open-Home-Foundation-Matter-Servers (matter-js/python-matter-server, Apache&nbsp;2.0)."
K20 = "Der Matter-Server ist archiviert"
K21 = "Nachgesehen am 06.08.2026: Das Projekt ist von <i>home-assistant-libs</i> in die Organisation <i>matter-js</i> umgezogen und wurde dort am <b>23.06.2026 archiviert</b> — es ist schreibgeschützt. Das Container-Abbild <span class='sm-mono'>ghcr.io/matter-js/python-matter-server:stable</span> <b>gibt es weiterhin</b> (Fassung 8.1.2, veröffentlicht vor rund acht Monaten, über 1,1&nbsp;Millionen Abrufe). Dieses Plugin läuft also."
K22 = "Praktisch heißt das: Neue Gerätetypen und Fehlerbehebungen entstehen nicht mehr hier, sondern im Nachfolger <i>matterjs-server</i> derselben Organisation. Bestehende Installationen laufen weiter, solange das Abbild abrufbar bleibt."
K23 = "Nachgesehen am 17.08.2026: Der Nachfolger beschreibt sich selbst als <i>drop-in replacement</i> mit einer zum Python Matter Server kompatiblen WebSocket-Schnittstelle und nennt fünf gewollte Abweichungen - keine davon berührt einen Weg, den dieses Plugin benutzt. Ein Praxistest ist das nicht, aber der frühere Vorbehalt „nicht geprüft“ war einer, den man hätte nachsehen können."
K24 = "<b>OK im Endpunkt:</b> 1 heißt, der Brückendienst ist mit dem Matter-Server verbunden UND sein Herzschlag ist höchstens drei Takte alt (Einstellung Herzschlag, Vorgabe 60 s, also 180 s). Stirbt oder hängt der Dienst, fällt OK spätestens danach auf 0. ALTER daneben ist das Alter der Werte und wächst in einem ruhigen Haus auch bei gesundem Dienst. Mit Herzschlag 0 gibt es keine Altersgrenze."
K25 = "<b>Türen und Schlösser unter dem Haus-Thema</b> (Reiter MQTT, ab Werk aus): jeder Kontaktsensor geht zusätzlich als <span class='sm-mono'>haus/tuer/&lt;Name&gt;/offen</span> (1 offen, 0 zu), jedes Türschloss als <span class='sm-mono'>haus/tuer/&lt;Name&gt;/verriegelt</span> (1 verriegelt, 0 nicht) hinaus, beide zurückbehalten, <span class='sm-mono'>-</span> ohne Aussage. &lt;Name&gt; ist die Gerätebezeichnung, klein, Umlaute als ae/oe/ue/ss, sonst Unterstrich. Das ist die Form, die Funkwacht und Beschattungswächter lesen. Abhaken und Deinstallation räumen die Themen ab. <b>Container-Knöpfe:</b> starten, anhalten, neu starten, entfernen und aktualisieren wirken nur auf den eigenen Container (Label <span class='sm-mono'>de.loxberry.plugin.folder</span> - immer, auch wenn der Haken „Matter-Server von diesem Plugin betreiben lassen“ aus ist -, oder ein Altbestand ohne Label mit Matter-Server-Abbild, dessen <span class='sm-mono'>/data</span> aus der Fabric dieses Plugins kommt) - dieselbe Prüfung wie die Deinstallation; sonst steht der Befehl zum Abtippen da. <b>Schlösser im Endpunkt:</b> <span class='sm-mono'>sperren</span> geht immer hinaus und wird nie gebremst; <span class='sm-mono'>entsperren</span> antwortet <span class='sm-mono'>UNVERAENDERT=1</span> nur bei demselben Befehl innerhalb von 60 s, wenn das Schloss offen meldet, und HTTP 429 mit <span class='sm-mono'>WARTEN_S</span> nur innerhalb von 10 s nach einem <span class='sm-mono'>sperren</span>. <b>Gleichwert-Unterdrückung:</b> derselbe Sollwert (<span class='sm-mono'>ein</span>/<span class='sm-mono'>aus</span>, helligkeit, farbtemperatur, farbe, farbton, saettigung, loxfarbe, farbe_xy, rollo, lamelle, soll_heizen, soll_kuehlen, betriebsart, luefter) für dasselbe Gerät innerhalb von 60 s wird nicht erneut gesendet (<span class='sm-mono'>UNVERAENDERT=1</span>), ein anderer Wert geht sofort hinaus; umschalten, rollo_auf/_zu/_stopp, identify, attribut und befehl gehen immer hinaus. Die Sperre gilt je Gerät; ist sie länger als rund 2 s belegt, antwortet der Endpunkt 503 mit <span class='sm-mono'>GRUND=BESCHAEFTIGT</span>. Die Antwort eines Stellbefehls trägt wahlweise <span class='sm-mono'>;IST=&lt;Wert&gt;</span> vor <span class='sm-mono'>MELDUNG</span>. <b>Neue Aktionen:</b> <span class='sm-mono'>loxfarbe</span> (Wert des Loxone-Farbbausteins, RGB <span class='sm-mono'>BBBGGGRRR</span> oder Lumitech <span class='sm-mono'>20bbbtttt</span>), <span class='sm-mono'>farbe_xy</span> (<span class='sm-mono'>&amp;x=&amp;y=</span>, je 0 bis 1), <span class='sm-mono'>lamelle</span> (0 bis 100). Der Rohweg sperrt die Cluster 31, 48, 49, 60, 62, 63 und Cluster 257 ohne <i>Schlösser schalten zulassen</i>; die Nutzlast muss ein JSON-Objekt sein."
K26 = "<b>Neu in 0.9.35:</b> Container-Einstellungen (Name, Abbild, Port, Bluetooth, Hauptschnittstelle, nur lokal lauschen) wirken erst nach dem Neuanlegen - weicht der laufende Container ab, sagt es der Reiter Einstellungen und bietet <i>Einstellungen übernehmen (Container neu anlegen)</i> an. Neu angelegt wird mit Rückweg (der alte wird erst entfernt, wenn der neue läuft) und vorher automatisch gesicherter Fabric (<span class='sm-mono'>data/plugins/&lt;ordner&gt;.fabric_sicherungen/</span>, die drei neuesten); im Reiter Einstellungen lässt sich eine Sicherung oder ein eigenes tar.gz zurückspielen. Der eigene Matter-Server lauscht ab Werk nur auf 127.0.0.1. Ein <b>Lesetoken</b> (Reiter Einbindung in Loxone) öffnet nur lesende Aktionen (status, statusalle, wert, liste, roh). Der Reiter Test prüft zusätzlich Router-Advertisements für Thread (accept_ra, accept_ra_rt_info_max_plen), den Bluetooth-Adapter, die Belegung der Ports 5580 und 5540 und die Abo-Dateien des MQTT-Gateways. Unter „Für Fortgeschrittene“ steigt der Knopf <i>Auf matterjs-server umsteigen (Beta)</i> auf den Nachfolger um (Abbild, Aufrufzeile, Fabric-Sicherung, Rückweg); <i>Zurück zu python-matter-server</i> kehrt um. Beide dürfen nie gleichzeitig auf derselben Fabric laufen."
