[AUTHOR]
NAME=Matter2Lox Plugin Authors
EMAIL=matter2lox@users.noreply.github.com

[PLUGIN]
VERSION=0.9.9
NAME=matter2lox
FOLDER=matter2lox
TITLE=Matter to Loxone

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide 0.9.1 lauten, wird niemandem etwas angeboten; sobald der
# Zweig eine hoehere Fassung fuehrt, greift die Aktualisierung von selbst.
#
# Wichtig: Adressen NIE auf ein fremdes Repository richten. LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Matter2Lox/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Matter2Lox/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Matter setzt 64 Bit voraus (Vorgabe des Matter-Servers: "Running it on non
# 64 bits architecture ... is not supported"). LoxBerry prueft die Architektur
# aber nur gegen seine eigene Liste; die Pruefung macht deshalb postinstall.sh
# und meldet es klar, statt die Installation kommentarlos abzubrechen.
ARCHITECTURE=false
